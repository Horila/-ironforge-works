Rules: only emit actions the user actually asked for or clearly implied by logging intent. Always also write a normal human reply above the json block. Never show the json to the user in prose. If the user asks for a visual change, do it via set_theme or custom_css rather than refusing.`;
  },

  async ai(text){
    Coach.busy=true;Coach.render();
    const s=S.settings;
    try{
      const hist=S.chat.filter(m=>m.role!=='system').slice(-16)
        .map(m=>({role:m.role==='user'?'user':'assistant',content:m.content}));
      let out='';
      if(s.provider==='gemini'){
        const body=JSON.stringify({system_instruction:{parts:[{text:Coach.sysPrompt()}]},
          contents:hist.map(m=>({role:m.role==='assistant'?'model':'user',parts:[{text:m.content}]})),
          generationConfig:{temperature:.7}});
        const call=async model=>{
          const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(s.apiKey)}`,
            {method:'POST',headers:{'Content-Type':'application/json'},body});
          return r.json();
        };
        let model=s.model||GEM_PREF[0];
        let j=await call(model);
        /* model renamed or retired? rediscover once and retry */
        if(j.error&&/not found|not supported|NOT_FOUND|404/i.test(j.error.message||'')){
          const found=Gem.pick(await Gem.listModels(s.apiKey));
          if(found&&found!==model){model=found;S.settings.model=found;save();j=await call(found)}
        }
        if(j.error)throw new Error(j.error.message);
        if(j.promptFeedback?.blockReason)throw new Error('Blocked by Google safety filter ('+j.promptFeedback.blockReason+')');
        out=(j.candidates?.[0]?.content?.parts||[]).filter(p=>!p.thought).map(p=>p.text||'').join('');
        if(!out.trim()){
          const fin=j.candidates?.[0]?.finishReason||'';
          throw new Error(/MAX_TOKENS/i.test(fin)
            ?'The model spent its whole budget thinking and never answered. Ask again, or ask something shorter.'
            :'Empty reply from '+model+(fin?' — finish reason '+fin:'')+'.');
        }
      }else if(s.provider==='anthropic'){
        const send=async n=>{
          const r=await fetch('https://api.anthropic.com/v1/messages',{
            method:'POST',headers:{'Content-Type':'application/json','x-api-key':s.apiKey,
              'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
            body:JSON.stringify({model:s.model||'claude-haiku-4-5-20251001',max_tokens:n,
              system:Coach.sysPrompt(),messages:hist})});
          return r.json();
        };
        let j=await send(MAXTOK);
        if(j.error&&/max_tokens/i.test(j.error.message||''))j=await send(4096);
        if(j.error)throw new Error(j.error.message);
        out=(j.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('');
      }else{
        const r=await fetch('https://api.openai.com/v1/chat/completions',{
          method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.apiKey},
          body:JSON.stringify({model:s.model||'gpt-4o-mini',temperature:.7,
            messages:[{role:'system',content:Coach.sysPrompt()},...hist]})});
        const j=await r.json();
        if(j.error)throw new Error(j.error.message);
        out=j.choices?.[0]?.message?.content||'';
      }
      Coach.busy=false;
      const {clean,actions}=parseActions(out);
      Coach.push('assistant',clean||'(no reply)');
      if(actions.length)Actions.apply(actions);
    }catch(e){
      Coach.busy=false;
      Coach.push('assistant',`Couldn't reach the AI: **${e.message||e}**\n\nRe-run the setup and I'll re-test the key and re-detect the model.\n\n[[connect]]`);
    }
  }
};

/* markdown-lite ------------------------------------------------- */
function md(s){
  let h=esc(s);
  h=h.replace(/```[\s\S]*?```/g,'');
  h=h.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
     .replace(/`([^`]+)`/g,'<code>$1</code>')
     .replace(/^\s*[-•*]\s+(.*)$/gm,'<li>$1</li>')
     .replace(/(<li>[\s\S]*?<\/li>)(?!\s*<li>)/g,'<ul>$1</ul>')
     .replace(/\n{2,}/g,'<br><br>').replace(/\n/g,'<br>');
  h=h.replace(/<\/ul><br><ul>/g,'');
  h=h.replace(/\[\[connect\]\]/gi,'<button class="cta" onclick="Gem.wizard()">⚡ Connect Gemini — free, 1 min</button>');
  h=h.replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,'<a class="lk" href="$2" target="_blank" rel="noopener">$1</a>');
  return h;
}
function parseActions(txt){
  const acts=[];
  const clean=txt.replace(/```(?:json)?\s*([\s\S]*?)```/g,(m,body)=>{
    try{const j=JSON.parse(body.trim());
      if(Array.isArray(j.actions))acts.push(...j.actions);
      else if(j.type)acts.push(j);
      return '';
    }catch(e){return m}
  }).trim();
  return {clean,actions:acts};
}

const Gem={

    if(Gem.connected()||S.onboardStep>=0&&S.onboardStep<ONB.length){el.innerHTML='';return}

  pick(models){
    const usable=models.filter(m=>(m.supportedGenerationMethods||m.supportedActions||[])
      .some(x=>/generateContent/i.test(x))).map(m=>String(m.name||'').replace(/^models\//,''));
    for(const want of GEM_PREF){const hit=usable.find(u=>u===want);if(hit)return hit}
    for(const want of GEM_PREF){const hit=usable.find(u=>u.startsWith(want));if(hit)return hit}
    const flash=usable.filter(u=>/flash/i.test(u)&&!/thinking|image|audio|live|tts|embed/i.test(u))
      .sort((a,b)=>b.localeCompare(a,undefined,{numeric:true}));
    if(flash.length)return flash[0];
    const any=usable.filter(u=>!/embed|aqa|image|tts|audio|live/i.test(u));
    return any[0]||null;

  async listModels(key){
    const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models?key='+encodeURIComponent(key)+'&pageSize=200');

/* ============================================================
   ACTIONS — how the chat edits the app & the data
   ============================================================ */
const Actions={
  apply(list){
    const done=[];
    list.forEach(a=>{try{const r=Actions.one(a);if(r)done.push(r)}catch(e){console.warn('action failed',a,e)}});
    save();UI.refresh();
    if(done.length){Coach.push('system','✓ '+done.join(' · '));}
  },
  one(a){
    const t=(a.type||'').toLowerCase();
    switch(t){
      case 'log_meal':{
        S.meals.unshift({id:uid(),date:a.date||todayISO(),name:a.name||'Meal',
          kcal:+a.kcal||0,p:+(a.protein??a.p)||0,c:+(a.carbs??a.c)||0,f:+(a.fat??a.f)||0,
          meal:a.meal||'Snack'});
        return `logged ${a.name} (${Math.round(+a.kcal||0)} kcal)`;
      }
      case 'log_weight':{
        const d=a.date||todayISO();
        const prev=S.body.find(b=>b.date===d)||{};
        const rec={...prev,date:d};
        ['weightKg','bodyFat','waist','chest','arm','thigh'].forEach(k=>{if(a[k]!=null)rec[k]=+a[k]});
        S.body=S.body.filter(b=>b.date!==d);S.body.push(rec);
        S.body.sort((x,y)=>x.date<y.date?1:-1);
        if(rec.weightKg){S.profile.weightKg=rec.weightKg;recalcTargets()}
        return `body metrics saved for ${d}`;
      }
      case 'log_workout':{
        const w={id:uid(),date:a.date||todayISO(),name:a.name||'Session',
          exercises:(a.exercises||[]).map(e=>({name:e.name,muscle:e.muscle||
            (LIB.find(l=>l.name.toLowerCase()===String(e.name).toLowerCase())||{}).muscle||'Other',
            sets:(e.sets||[]).map(s=>({w:+s.w||+s.weight||0,r:+s.r||+s.reps||0,done:true}))})),
          duration:a.duration||null};
        w.exercises.forEach(e=>e.sets.forEach(s=>checkPR(e.name,s.w,s.r)));
        S.workouts.unshift(w);
        return `workout "${w.name}" logged`;
      }
      case 'log_habit':{setHabit(a.date||todayISO(),a.id,a.value);return `${a.id} → ${a.value}`}
      case 'add_habit':{S.customHabits.push({id:uid(),name:a.name,unit:a.unit||'',
        target:+a.target||1,icon:a.icon||'✅'});return `habit "${a.name}" added`}
      case 'remove_habit':{S.customHabits=S.customHabits.filter(h=>h.id!==a.id&&h.name!==a.name);
        return `habit removed`}
      case 'add_tracker':{S.trackers.push({id:uid(),name:a.name,unit:a.unit||'',icon:a.icon||'📊'});
        return `tracker "${a.name}" added`}
      case 'log_tracker':{
        const tr=S.trackers.find(x=>x.name.toLowerCase()===String(a.name).toLowerCase());
        if(!tr)return null;
        S.trackerLogs[tr.id]=S.trackerLogs[tr.id]||{};
        S.trackerLogs[tr.id][a.date||todayISO()]=+a.value;
        return `${tr.name} = ${a.value}`;
      }
      case 'set_profile':{
        Object.entries(a).forEach(([k,v])=>{if(k!=='type'&&k in S.profile)S.profile[k]=v});
        recalcTargets();return 'profile updated';
      }
      case 'set_targets':{
        ['kcal','protein','carbs','fat','water','sleep','steps'].forEach(k=>{if(a[k]!=null)S.targets[k]=+a[k]});
        return 'targets updated';
      }
      case 'set_theme':{
        ['accent','accent2','bg','surface'].forEach(k=>{if(a[k])S.settings[k]=a[k]});
        return 'theme updated';
      }
      case 'set_app_name':{S.settings.appName=a.name;return `renamed to ${a.name}`}
      case 'hide_card':{if(!S.settings.hidden.includes(a.id))S.settings.hidden.push(a.id);return `${a.id} hidden`}
      case 'show_card':{S.settings.hidden=S.settings.hidden.filter(x=>x!==a.id);return `${a.id} shown`}
      case 'custom_css':{S.settings.customCSS=(a.append?(S.settings.customCSS+'\n'):'')+(a.css||'');return 'styles applied'}
      case 'add_exercise':{S.exercises=S.exercises||[];S.exercises.push({name:a.name,muscle:a.muscle||'Other'});
        return `${a.name} added to library`}
      default:return null;
    }
  }
};

const PALETTE={red:['#ef4444','#f97316'],orange:['#ff4d1f','#ffb020'],amber:['#f59e0b','#fbbf24'],
  green:['#22c55e','#84cc16'],lime:['#84cc16','#bef264'],emerald:['#10b981','#34d399'],
  blue:['#3b82f6','#38bdf8'],cyan:['#06b6d4','#22d3ee'],teal:['#14b8a6','#2dd4bf'],
  purple:['#a855f7','#c084fc'],violet:['#8b5cf6','#a78bfa'],pink:['#ec4899','#f472b6'],
  gold:['#eab308','#fde047'],white:['#e5e7eb','#9ca3af'],mono:['#e5e7eb','#9ca3af']};

const Local={
  reply(text){
    const t=text.toLowerCase();
    const acts=[];let msg=null;

    /* --- theme --- */
    const colorHit=Object.keys(PALETTE).find(c=>new RegExp('\\b'+c+'\\b').test(t));
    if(colorHit&&/(make|change|turn|theme|colou?r|switch)/.test(t)){
      const [a,b]=PALETTE[colorHit];
      acts.push({type:'set_theme',accent:a,accent2:b});
      msg=`Done — ${colorHit} it is. Anything else you want moved around?`;
    }
    const hex=t.match(/#([0-9a-f]{6})/);
    if(hex&&!colorHit){acts.push({type:'set_theme',accent:'#'+hex[1]});msg='Accent updated.'}
    if(/light mode/.test(t)){
      acts.push({type:'set_theme',bg:'#f2f3f6',surface:'#ffffff'});
      acts.push({type:'custom_css',css:':root{--txt:#0d1117;--mut:#5b6472;--dim:#8b93a1;--line:#e2e5ea;--surface2:#f5f6f9;--bg2:#ffffff}body::before{opacity:.18}'});
      msg="Light mode on. Fair warning: this thing was designed for a dark gym. Say “dark mode” to undo."}
    if(/dark mode/.test(t)){acts.push({type:'set_theme',bg:'#08090c',surface:'#111319'});
      acts.push({type:'custom_css',css:''});msg='Back to dark.'}

    /* --- rename --- */
    const rn=text.match(/(?:rename|call) (?:the |this )?app (?:to |")?([\w\s'-]{2,24})/i);
    if(rn){acts.push({type:'set_app_name',name:rn[1].trim().replace(/"$/,'')});msg=`Renamed to ${rn[1].trim()}.`}

    /* --- hide/show cards --- */
    const cards={rings:'rings',macro:'rings',volume:'volume',weight:'weight',muscle:'muscle',
      habit:'habits',pr:'prs',record:'prs',stat:'today'};
    if(/\b(hide|remove|get rid of)\b/.test(t)){
      const k=Object.keys(cards).find(c=>t.includes(c));
      if(k){acts.push({type:'hide_card',id:cards[k]});msg=`Hidden. Say "show ${k}" to bring it back.`}
    }
    if(/\b(show|bring back|unhide)\b/.test(t)){
      const k=Object.keys(cards).find(c=>t.includes(c));
      if(k){acts.push({type:'show_card',id:cards[k]});msg='Back on the dashboard.'}
    }

    /* --- log weight --- */
    const wm=t.match(/(?:weigh(?:ed|t)?|scale)\D{0,12}(\d{2,3}(?:[.,]\d)?)/);
    if(wm){const kg=parseFloat(wm[1].replace(',','.'));
      acts.push({type:'log_weight',weightKg:kg});
      const last=[...S.body].sort((a,b)=>a.date<b.date?1:-1)[0];
      const d=last&&last.weightKg?round(kg-last.weightKg,1):null;
      msg=`${kg} kg logged.${d!=null&&d!==0?` That's ${d>0?'+':''}${d} kg on your last entry — ${Math.abs(d)>1.5?"probably water and food weight, don't panic":'right in the normal daily noise'}.`:''}`;
    }

    /* --- log food --- */
    if(!acts.length&&/(ate|eaten|eat|had|log|logged|drank|consumed)/.test(t)){
      const hit=FOODS.find(f=>t.includes(f.name.toLowerCase().split(' ')[0])&&f.name.split(' ')[0].length>3);
      const kc=t.match(/(\d{2,4})\s*(?:kcal|cal|calories)/);
      const pr=t.match(/(\d{1,3})\s*g?\s*(?:protein|prot)/);
      if(hit||kc){
        const name=hit?hit.name:(text.replace(/^\s*(i\s+)?(ate|had|eat|log(ged)?)\s*/i,'').slice(0,40)||'Meal');
        acts.push({type:'log_meal',name,kcal:kc?+kc[1]:hit.kcal,
          protein:pr?+pr[1]:(hit?hit.p:0),carbs:hit?hit.c:0,fat:hit?hit.f:0,meal:'Snack'});
        const m=dayMacros(todayISO());
        msg=`Logged. You're on ${Math.round(m.kcal+(kc?+kc[1]:hit.kcal))} kcal today — ${Math.max(0,Math.round(S.targets.kcal-m.kcal-(kc?+kc[1]:hit.kcal)))} left.`;
      }
    }

    if(acts.length){
      Actions.apply(acts);
      if(msg)Coach.push('assistant',msg);
      return;
    }

    /* --- knowledge / coaching replies --- */
    const p=S.profile,tg=S.targets,m=dayMacros(todayISO());
    if(/(what|should).*(eat|meal|food|dinner|lunch|breakfast)/.test(t)){
      const left=Math.round(tg.kcal-m.kcal),pLeft=Math.round(tg.protein-m.p);
      return Coach.push('assistant',
`You've got **${left} kcal** and **${pLeft}g protein** left today.

${pLeft>40?`Protein's the gap. Something like:
• 200g chicken breast + 250g rice + veg — ~600 kcal, 60g protein
• 2 scoops whey + 500ml milk + banana — ~500 kcal, 60g protein
• 200g Greek yogurt + 40g granola + berries — ~340 kcal, 25g protein`
:`Protein's basically handled. Fill the rest with whatever keeps you sane — fruit, rice, potatoes, a bit of fat.`}

${left<0?'You are over for the day. Not a disaster — one day means nothing, the seven-day average is what moves the scale.':''}`);
    }
    if(/(program|routine|split|plan|workout for)/.test(t)){
      const d=p.daysPerWeek||4;
      const plans={
        2:'**Full Body A/B, 2×/week**\nA: Squat 3×5 · Bench 3×5 · Row 3×8 · Plank 3×45s\nB: Deadlift 3×5 · Overhead Press 3×5 · Lat Pulldown 3×10 · Curl 3×12',
        3:'**Full Body ×3 (Mon/Wed/Fri)**\nA: Squat 3×5 · Bench 3×5 · Barbell Row 3×8\nB: Deadlift 1×5 · Overhead Press 3×5 · Pull-Up 3×max\nC: Front Squat 3×6 · Incline DB Press 3×8 · Cable Row 3×10 + arms',
        4:'**Upper / Lower ×2**\nUpper A: Bench 4×6 · Row 4×8 · OHP 3×8 · Lat Pulldown 3×10 · Curl 3×12\nLower A: Squat 4×5 · RDL 3×8 · Leg Press 3×12 · Calf 4×15\nUpper B: Incline DB 4×8 · Pull-Up 4×max · Lateral Raise 4×15 · Face Pull 3×15 · Pushdown 3×12\nLower B: Deadlift 3×4 · Front Squat 3×8 · Leg Curl 3×12 · Hip Thrust 3×10',
        5:'**Push / Pull / Legs / Upper / Lower**\nPush: Bench 4×6 · OHP 3×8 · Incline DB 3×10 · Lateral 4×15 · Pushdown 3×12\nPull: Deadlift 3×4 · Pull-Up 4×max · Row 4×8 · Face Pull 3×15 · Curl 3×12\nLegs: Squat 4×6 · RDL 3×8 · Leg Press 3×12 · Leg Curl 3×12 · Calf 4×15\nUpper: volume day, 10-15 rep range\nLower: volume day, 10-15 rep range',
        6:'**Push / Pull / Legs ×2**\nHeavy day 4-6 reps, volume day 8-15 reps. Same movements, different intensity.'
      };
      return Coach.push('assistant',
`${plans[clamp(d,2,6)]||plans[4]}

**Rules that matter more than the split:**
• Add reps or weight to something every week. Progression *is* the program.
• Take the last set within 1–2 reps of failure. Not to failure on compounds.
• 2–3 min rest on big lifts, 60–90s on isolation.
${p.injuries&&p.injuries!=='none'?`\nGiven your ${p.injuries}: swap anything that aggravates it for a machine or unilateral version rather than pushing through.`:''}

Tap **Train** and hit a template to start logging it.`);
    }
    if(/(progress|how am i|doing|trend|going)/.test(t)){
      const ws=bodySeries('weightKg',30);
      const vol=volumeByWeek(4);
      const trend=ws.length>1?round(ws[ws.length-1].y-ws[0].y,1):null;
      return Coach.push('assistant',
`**Last 30 days**
• Sessions: ${S.workouts.filter(w=>w.date>=daysAgo(29)).length}
• Weekly volume: ${vol.map(v=>Math.round(v.vol/1000)+'t').join(' → ')}
• Weight: ${trend!=null?(trend>0?'+':'')+trend+' kg':'not enough entries'}
• PRs on file: ${Object.keys(S.prs).length}
• Streak: ${streak()} days

${trend!=null?(p.goal==='cut'?(trend<0?'Moving the right way. Hold the deficit.':'Scale is flat or up on a cut — the honest answer is usually the food log, not metabolism.'):
p.goal==='bulk'?(trend>0?'Gaining as intended. If it is faster than ~0.4 kg/week, pull back 200 kcal.':'Not gaining — add 250 kcal and reassess in two weeks.'):'Steady.'):'Log a few more weigh-ins and I can call the trend.'}`);
    }
    if(/(help|what can you|how do)/.test(t)){
      return Coach.push('assistant',
`Things I do without any AI key:

• **Log** — "weighed 82.4", "ate 200g chicken", "logged 500 kcal"
• **Restyle** — "make it purple", "light mode", "rename app to BEASTMODE", "hide the muscle chart"
• **Coach** — "build me a program", "what should I eat", "how am I progressing"

For real conversation — reading your uploaded documents, custom programming, rebuilding the app on request — connect a free Gemini key. No card, about a minute.

[[connect]]`);
    }
    if(/(sore|doms|ache|pain|hurt)/.test(t)){
      return Coach.push('assistant',
`Soreness is a poor proxy for a good session — you can grow without it and be wrecked from a bad one.

• Sore but full range of motion, no sharp pain → train, it usually improves once warm
• Sharp, joint-specific, or getting worse mid-set → stop, swap the movement
• Persistent 5+ days → your volume jumped too fast; cut a set per exercise

If it's a real injury rather than DOMS, see a physio. I'm a tracker, not a doctor.`);
    }
    if(/(protein|how much protein)/.test(t)){
      return Coach.push('assistant',
`Your target is **${tg.protein}g/day** — around ${round(tg.protein/(p.weightKg||80),1)}g per kg of bodyweight.

Above roughly 1.6 g/kg the returns flatten hard. More matters slightly on a deficit because it protects muscle and keeps you full. Spread it across 3–4 feeds rather than one giant hit.`);

[[connect]]`);
  }

    <div class="field"><label>Activity</label><select onchange="Cfg.p('activity',this.value)">
      ${Object.keys(ACT).map(x=>`<option ${p.activity===x?'selected':''}>${x}</option>`).join('')}</select></div>
  </div>
  <button class="btn btn-g btn-sm btn-w" onclick="Cfg.recalc()">Recalculate targets from profile</button>

  <div class="divider"></div><div class="card-t">Daily targets</div>
  <div class="grid2">
    ${[['kcal','Calories'],['protein','Protein g'],['carbs','Carbs g'],['fat','Fat g'],
       ['water','Water L'],['sleep','Sleep h']].map(([k,l])=>
      `<div class="field"><label>${l}</label><input type="number" step="any" value="${t[k]}" onchange="Cfg.t('${k}',this.value)"></div>`).join('')}
  </div>

  <div class="divider"></div><div class="card-t">Appearance</div>
  <div class="field"><label>App name</label><input value="${esc(s.appName)}" onchange="Cfg.s('appName',this.value)"></div>
  <div class="grid2">
    <div class="field"><label>Accent</label><input type="color" value="${s.accent}" style="height:46px;padding:4px" onchange="Cfg.s('accent',this.value)"></div>
    <div class="field"><label>Accent 2</label><input type="color" value="${s.accent2}" style="height:46px;padding:4px" onchange="Cfg.s('accent2',this.value)"></div>
    <div class="field"><label>Background</label><input type="color" value="${s.bg}" style="height:46px;padding:4px" onchange="Cfg.s('bg',this.value)"></div>
    <div class="field"><label>Surface</label><input type="color" value="${s.surface}" style="height:46px;padding:4px" onchange="Cfg.s('surface',this.value)"></div>
  </div>
  <div class="chips" style="margin:0 0 12px">
    ${Object.entries(PALETTE).slice(0,10).map(([n,[a,b]])=>
      `<span class="chip" style="border-color:${a};color:${a}" onclick="Cfg.palette('${a}','${b}')">${n}</span>`).join('')}
  </div>
  <label>Dashboard cards</label>
  ${CARDS.map(([id,l])=>`<div class="spread" style="padding:7px 0">
    <span style="font-size:14px">${l}</span>
    <label class="sw"><input type="checkbox" ${s.hidden.includes(id)?'':'checked'} onchange="Cfg.card('${id}',this.checked)"><i></i></label>
  </div>`).join('')}
  <div class="field" style="margin-top:12px"><label>Custom CSS</label>
    <textarea rows="4" placeholder=".card{border-radius:4px}" onchange="Cfg.s('customCSS',this.value)">${esc(s.customCSS)}</textarea>
    <div class="notice">Or just ask the Coach: “make the cards square”.</div></div>
  <div class="field"><label>Rest timer (seconds)</label>
    <input type="number" value="${s.restSec}" onchange="Cfg.s('restSec',+this.value)"></div>

  <div class="divider"></div><div class="card-t">AI coach</div>
  <div class="field"><label>Provider</label><select id="provSel" onchange="Cfg.prov(this.value)">
    <option value="none" ${s.provider==='none'?'selected':''}>Offline coach (no key, works now)</option>
    <option value="gemini" ${s.provider==='gemini'?'selected':''}>Google Gemini — free tier</option>
    <option value="anthropic" ${s.provider==='anthropic'?'selected':''}>Anthropic Claude</option>
    <option value="openai" ${s.provider==='openai'?'selected':''}>OpenAI</option>
  </select></div>
  <div class="field"><label>API key</label>
    <input type="password" value="${esc(s.apiKey)}" placeholder="paste key" onchange="Cfg.s('apiKey',this.value.trim())"></div>
  <div class="field"><label>Model (optional)</label>
    <input value="${esc(s.model)}" placeholder="${s.provider==='gemini'?'auto-detected':s.provider==='anthropic'?'claude-haiku-4-5-20251001':'gpt-4o-mini'}" onchange="Cfg.s('model',this.value.trim())"></div>
  <button class="btn btn-p btn-w" style="margin-bottom:8px" onclick="Gem.wizard()">⚡ Guided Gemini setup (free)</button>
  ${s.provider==='gemini'&&s.apiKey?`<div class="keyres ok">Connected · using <b>${esc(s.model||'auto')}</b>
     <span onclick="Cfg.redetect()" style="text-decoration:underline;cursor:pointer;margin-left:6px">re-detect model</span></div>`:''}
  <div class="notice">The key is stored only in this browser and is sent only to the provider you pick. Nothing else about your data ever leaves this device.</div>

  <div class="divider"></div><div class="card-t">Documents (${S.docs.length})</div>
  ${S.docs.length?S.docs.map((d,i)=>`<div class="li"><div class="ic">📄</div>
    <div class="tx"><b>${esc(d.name)}</b><small>${d.text.length.toLocaleString()} chars · ${fmtDate(d.date)}</small></div>
    <span onclick="Cfg.rmDoc(${i})" style="color:var(--bad);cursor:pointer">✕</span></div>`).join('')
   :`<div class="notice">Upload training programs, blood tests, diet plans or exported data via the 📎 in the Coach tab. The AI reads them when answering.</div>`}
  <button class="btn btn-g btn-sm btn-w" style="margin-top:8px" onclick="document.getElementById('fileIn').click()">Upload document</button>

  <div class="divider"></div><div class="card-t">Data</div>
  <div class="grid2">
    <button class="btn btn-g btn-sm" onclick="Cfg.export()">Export JSON</button>
    <button class="btn btn-g btn-sm" onclick="document.getElementById('impIn').click()">Import JSON</button>
    <button class="btn btn-g btn-sm" onclick="Cfg.demo()">Load demo data</button>
    <button class="btn btn-g btn-sm" style="color:var(--bad)" onclick="Cfg.reset()">Reset everything</button>
  </div>
  <input type="file" id="impIn" accept=".json" style="display:none" onchange="Cfg.import(this)">
  <div class="notice">Everything lives in this browser only. Export regularly if the data matters to you — clearing browser storage wipes it.</div>
  <div style="height:20px"></div>`);
};

const Cfg={
  p(k,v){S.profile[k]=v;recalcTargets();save();UI.refresh()},
  t(k,v){S.targets[k]=+v;save();UI.refresh()},
  s(k,v){S.settings[k]=v;save();UI.refresh()},
  prov(v){S.settings.provider=v;save();UI.openSettings()},
  palette(a,b){S.settings.accent=a;S.settings.accent2=b;save();UI.refresh();UI.openSettings()},
  card(id,on){S.settings.hidden=on?S.settings.hidden.filter(x=>x!==id):[...new Set([...S.settings.hidden,id])];
    save();UI.refresh()},
  recalc(){if(recalcTargets()){save();UI.refresh();UI.openSettings();UI.toast('Targets recalculated')}
    else UI.toast('Need age, height and weight first')},
  rmDoc(i){S.docs.splice(i,1);save();UI.openSettings()},
  export(){
    const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download=`ironforge-${todayISO()}.json`;a.click();UI.toast('Exported');
  },
  import(inp){
    const f=inp.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{try{S=deepMerge(blank(),JSON.parse(r.result));save();UI.closeSheet();UI.refresh();
      UI.toast('Data imported')}catch(e){UI.toast('Bad file')}};
    r.readAsText(f);
  },
  async redetect(){try{const m=Gem.pick(await Gem.listModels(S.settings.apiKey));
    if(!m)throw new Error('no chat model available');
    S.settings.model=m;save();UI.openSettings();UI.toast('Now using '+m)}
    catch(e){UI.toast('Failed: '+(e.message||e))}},
  reset(){if(confirm('Delete ALL data and start over? This cannot be undone.')){
    localStorage.removeItem(KEY);location.reload()}},
  demo(){
    if(!confirm('Load ~8 weeks of realistic sample data? This adds to what you already have.'))return;
    const ex=[['Barbell Bench Press','Chest',80],['Back Squat','Legs',110],['Deadlift','Back',140],
      ['Overhead Press','Shoulders',50],['Barbell Row','Back',70],['Pull-Up','Back',0],
      ['Lateral Raise','Shoulders',12],['Barbell Curl','Arms',30],['Leg Press','Legs',180],
      ['Romanian Deadlift','Legs',90],['Tricep Pushdown','Arms',35],['Lat Pulldown','Back',65]];
    const names=['Push Day','Pull Day','Leg Day','Upper Body'];
    let w0=S.profile.weightKg||82;
    for(let d=56;d>=0;d--){
      const iso=daysAgo(d),dow=new Date(iso+'T12:00:00').getDay();
      const prog=1+(56-d)/56*0.12;
      if([1,2,4,5].includes(dow)){
        const picks=[...ex].sort(()=>Math.random()-.5).slice(0,4+Math.round(Math.random()));
        S.workouts.unshift({id:uid(),date:iso,name:names[dow%names.length],duration:55+Math.round(Math.random()*25),
          exercises:picks.map(([n,mu,base])=>({name:n,muscle:mu,
            sets:[...Array(3+Math.round(Math.random()))].map(()=>({
              w:Math.round(base*prog/2.5)*2.5||0,r:6+Math.round(Math.random()*6),done:true}))}))});
      }
      if(d%2===0||Math.random()>.3){
        w0+=(Math.random()-0.56)*0.35;
        S.body.push({date:iso,weightKg:round(w0,1),
          bodyFat:round(18-(56-d)/56*2.4+(Math.random()-.5)*0.6,1),
          waist:round(84-(56-d)/56*3+(Math.random()-.5)*0.8,1),
          chest:round(102+(56-d)/56*1.5,1),arm:round(37+(56-d)/56*1.2,1),thigh:round(58+(56-d)/56*1.4,1)});
      }
      if(d<35){
        const meals=[['Oats + whey',420,38,52,9,'Breakfast'],['Chicken & rice',640,58,72,10,'Lunch'],
          ['Salmon, potato, greens',700,45,58,28,'Dinner'],['Greek yogurt + berries',210,22,18,4,'Snack']];
        meals.forEach(([n,k,p,c,f,ml])=>{if(Math.random()>.12)
          S.meals.unshift({id:uid(),date:iso,name:n,kcal:Math.round(k*(0.9+Math.random()*0.2)),
            p:Math.round(p),c:Math.round(c),f:Math.round(f),meal:ml})});
        S.habits[iso]={water:round(2+Math.random()*1.6,1),sleep:round(6.4+Math.random()*2,1),
          steps:Math.round(5000+Math.random()*7000),mood:3+Math.round(Math.random()*2)};
      }
    }
    S.workouts.forEach(w=>w.exercises.forEach(e=>e.sets.forEach(s=>checkPR(e.name,s.w,s.r))));
    S.body.sort((a,b)=>a.date<b.date?1:-1);
    S.profile.weightKg=S.body[0].weightKg;recalcTargets();
    save();UI.closeSheet();UI.refresh();UI.toast('Demo data loaded 📊');
  }
};

/* ============================================================
   DOCUMENT UPLOAD
   ============================================================ */
function handleFiles(files){
  [...files].forEach(f=>{
    const r=new FileReader();
    r.onload=()=>{
      let text=String(r.result||'').slice(0,60000);
      S.docs.push({name:f.name,text,date:todayISO()});save();
      UI.go('coach');
      Coach.push('system',`📄 ${f.name} attached (${text.length.toLocaleString()} chars)`);
      if(S.settings.provider!=='none'&&S.settings.apiKey){
        $('#chatIn').value=`I've uploaded ${f.name}. Read it and tell me what's useful in it for my training.`;
        Coach.send();
      }else{
        Coach.push('assistant',`Got **${f.name}**. It's saved, but offline mode can't actually read it. Connect a free Gemini key and I'll pull out everything useful.\n\n[[connect]]`);
      }
    };
    r.readAsText(f);
  });
}

/* ============================================================
   BOOT
   ============================================================ */
function init(){
  const had=load();
  if(!S.settings.hidden)S.settings.hidden=[];
  UI.applyTheme();

  $('#fileIn').addEventListener('change',e=>{handleFiles(e.target.files);e.target.value=''});
  $('#labelIn').addEventListener('change',e=>{Scan.file(e.target.files[0]);e.target.value=''});
  $('#labelCam').addEventListener('change',e=>{Scan.file(e.target.files[0]);e.target.value=''});
  const ta=$('#chatIn');
  ta.addEventListener('input',()=>{ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,120)+'px'});
  ta.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&!e.shiftKey&&window.innerWidth>700){e.preventDefault();Coach.send()}});

  $('#streakN').textContent=streak();

  if(!S.profile.onboarded){
    UI.go('coach');
    if(!S.chat.length)Coach.begin(); else Coach.render();
  }else{
    UI.go('home');Coach.render();
  }
  window.addEventListener('resize',()=>{clearTimeout(window._rz);
    window._rz=setTimeout(()=>Render[UI.view]&&Render[UI.view](),250)});

  /* Offline support for the home-screen (PWA) install. Skipped inside the
     native Android build, which already ships its files locally, and on
     file:// where service workers aren't allowed. */
  if('serviceWorker' in navigator && !native() && location.protocol.startsWith('http'))
    navigator.serviceWorker.register('sw.js').catch(()=>{});
}
window.addEventListener('DOMContentLoaded',init);
</script>
