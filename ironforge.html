<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#08090c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IRONFORGE">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>IRONFORGE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --acc:#ff4d1f; --acc2:#ffb020; --acc3:#38bdf8;
  --bg:#08090c; --bg2:#0d0f14;
  --surface:#111319; --surface2:#171a22; --line:#20242e;
  --txt:#f2f4f8; --mut:#8b93a5; --dim:#5d6474;
  --ok:#34d399; --warn:#fbbf24; --bad:#f43f5e;
  --r:18px; --pad:16px;
  --nav-h:calc(64px + env(safe-area-inset-bottom));
  --font-d:'Barlow Condensed',Impact,sans-serif;
  --font-b:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg);color:var(--txt);font-family:var(--font-b);
  font-size:15px;line-height:1.45;overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(80% 45% at 50% -8%, color-mix(in srgb,var(--acc) 22%, transparent) 0%, transparent 62%),
    radial-gradient(60% 40% at 100% 100%, color-mix(in srgb,var(--acc3) 10%, transparent) 0%, transparent 70%);
  opacity:.55;
}
#app{position:relative;z-index:1;max-width:520px;margin:0 auto;min-height:100%;
  padding-bottom:calc(var(--nav-h) + 12px)}
h1,h2,h3,.disp{font-family:var(--font-d);text-transform:uppercase;letter-spacing:.04em;margin:0;font-weight:700}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:40;padding:calc(env(safe-area-inset-top) + 14px) var(--pad) 12px;
  display:flex;align-items:center;gap:12px;
  background:linear-gradient(to bottom,var(--bg) 55%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
}
.logo{font-family:var(--font-d);font-size:26px;line-height:1;letter-spacing:.06em;
  background:linear-gradient(100deg,var(--txt) 20%,var(--acc) 95%);-webkit-background-clip:text;
  background-clip:text;color:transparent;flex:1;text-transform:uppercase;font-weight:700}
.hdr-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);
  background:var(--surface);display:grid;place-items:center;color:var(--mut);cursor:pointer;
  font-size:16px;flex:none;transition:.15s}
.hdr-btn:active{transform:scale(.92);color:var(--acc)}
.streak{display:flex;align-items:center;gap:5px;padding:7px 11px;border-radius:12px;
  background:color-mix(in srgb,var(--acc) 14%,transparent);border:1px solid color-mix(in srgb,var(--acc) 30%,transparent);
  font-size:13px;font-weight:700;color:var(--acc)}

/* ---------- layout ---------- */
main{padding:0 var(--pad)}
.view{display:none;animation:fade .28s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sec-t{display:flex;align-items:center;justify-content:space-between;margin:22px 0 10px}
.sec-t h2{font-size:15px;color:var(--mut);letter-spacing:.12em}
.sec-t .lnk{font-size:12px;color:var(--acc);font-weight:600;cursor:pointer;text-transform:uppercase;letter-spacing:.06em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;position:relative;overflow:hidden}
.card.tight{padding:13px}
.card-t{font-family:var(--font-d);font-size:14px;letter-spacing:.1em;color:var(--mut);text-transform:uppercase;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.row{display:flex;align-items:center;gap:10px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}

/* ---------- hero ---------- */
.hero{background:linear-gradient(155deg,var(--surface2),var(--surface));border:1px solid var(--line);
  border-radius:22px;padding:18px;margin-bottom:12px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;right:-40px;top:-60px;width:180px;height:180px;border-radius:50%;
  background:radial-gradient(circle,color-mix(in srgb,var(--acc) 35%,transparent),transparent 70%);filter:blur(6px)}
.hero .greet{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.14em;font-weight:600}
.hero .name{font-family:var(--font-d);font-size:30px;line-height:1.05;margin:2px 0 14px}
.hero .name b{color:var(--acc)}

/* ---------- stat ---------- */
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:13px}
.stat .k{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.11em;font-weight:700}
.stat .v{font-family:var(--font-d);font-size:26px;line-height:1.1;margin-top:3px}
.stat .v small{font-size:12px;color:var(--mut);font-family:var(--font-b);font-weight:600;margin-left:2px}
.stat .d{font-size:11px;font-weight:600;margin-top:2px;color:var(--mut)}
.up{color:var(--ok)} .down{color:var(--bad)}

/* ---------- rings ---------- */
.rings{display:flex;justify-content:space-around;align-items:center;gap:6px}
.ring{text-align:center;flex:1}
.ring svg{transform:rotate(-90deg);display:block;margin:0 auto}
.ring .rw{position:relative;width:78px;height:78px;margin:0 auto}
.ring .rc{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .rc b{font-family:var(--font-d);font-size:19px;line-height:1}
.ring .rc i{font-style:normal;font-size:9px;color:var(--dim);letter-spacing:.06em}
.ring .lbl{font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.09em;margin-top:7px;font-weight:700}

/* ---------- bars / progress ---------- */
.pbar{height:7px;border-radius:99px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}
.pbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .5s cubic-bezier(.4,0,.2,1)}
.macro-row{margin-bottom:11px}
.macro-row:last-child{margin-bottom:0}
.macro-row .lb{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px;font-weight:600}
.macro-row .lb span:last-child{color:var(--mut);font-variant-numeric:tabular-nums}

/* ---------- buttons ---------- */
button,.btn{font-family:var(--font-b);font-size:14px;font-weight:700;cursor:pointer;border:none;
  border-radius:13px;padding:13px 16px;transition:.15s;display:inline-flex;align-items:center;
  justify-content:center;gap:7px;color:var(--txt);background:var(--surface2);border:1px solid var(--line)}
button:active,.btn:active{transform:scale(.97)}
.btn-p{background:linear-gradient(100deg,var(--acc),color-mix(in srgb,var(--acc) 65%,var(--acc2)));
  color:#fff;border:none;box-shadow:0 6px 20px -8px var(--acc)}
.btn-g{background:transparent;border:1px solid var(--line);color:var(--mut)}
.btn-w{width:100%}
.btn-sm{padding:8px 12px;font-size:12.5px;border-radius:10px}
.btn-ic{width:40px;height:40px;padding:0;flex:none;border-radius:12px}
.chip{padding:8px 13px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);
  font-size:12.5px;font-weight:600;color:var(--mut);cursor:pointer;white-space:nowrap;transition:.15s}
.chip.on{background:color-mix(in srgb,var(--acc) 18%,transparent);border-color:var(--acc);color:var(--acc)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:0 calc(var(--pad)*-1);padding-left:var(--pad);padding-right:var(--pad);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}

/* ---------- inputs ---------- */
input,select,textarea{font-family:var(--font-b);font-size:15px;background:var(--bg2);color:var(--txt);
  border:1px solid var(--line);border-radius:12px;padding:12px 13px;width:100%;outline:none;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--acc);background:var(--surface)}
input::placeholder,textarea::placeholder{color:var(--dim)}
label{display:block;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em;
  font-weight:700;margin-bottom:6px}
.field{margin-bottom:13px}
select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' fill='%238b93a5'><path d='M6 8 0 0h12z'/></svg>");
  background-repeat:no-repeat;background-position:right 14px center}

/* ---------- list items ---------- */
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:none}
.li .ic{width:40px;height:40px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;
  font-size:17px;flex:none;border:1px solid var(--line)}
.li .tx{flex:1;min-width:0}
.li .tx b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .tx small{color:var(--dim);font-size:11.5px}
.li .rt{text-align:right;font-family:var(--font-d);font-size:17px;flex:none}
.li .rt small{display:block;font-family:var(--font-b);font-size:10px;color:var(--dim);font-weight:600;letter-spacing:.05em}
.empty{text-align:center;padding:34px 18px;color:var(--dim)}
.empty .e{font-size:38px;margin-bottom:10px;opacity:.5}
.empty p{margin:0;font-size:13px}

/* ---------- heatmap ---------- */
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.heat i{aspect-ratio:1;border-radius:5px;background:var(--surface2);border:1px solid var(--line)}
.heat i[data-l="1"]{background:color-mix(in srgb,var(--acc) 25%,var(--surface2));border-color:transparent}
.heat i[data-l="2"]{background:color-mix(in srgb,var(--acc) 50%,var(--surface2));border-color:transparent}
.heat i[data-l="3"]{background:color-mix(in srgb,var(--acc) 80%,var(--surface2));border-color:transparent}
.heat i[data-l="4"]{background:var(--acc);border-color:transparent;box-shadow:0 0 10px -2px var(--acc)}
.heat-d{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:6px}
.heat-d span{text-align:center;font-size:9px;color:var(--dim);font-weight:700;letter-spacing:.05em}

/* ---------- nav ---------- */
nav{position:fixed;bottom:0;left:0;right:0;z-index:50;height:var(--nav-h);
  padding-bottom:env(safe-area-inset-bottom);
  background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line);
  display:flex;max-width:520px;margin:0 auto}
nav button{flex:1;background:none;border:none;border-radius:0;padding:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--dim);position:relative}
nav button .ni{font-size:19px;line-height:1;transition:.2s}
nav button .nl{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em}
nav button.on{color:var(--acc)}
nav button.on .ni{transform:translateY(-2px) scale(1.12)}
nav button.on::before{content:'';position:absolute;top:0;width:26px;height:2.5px;border-radius:0 0 4px 4px;background:var(--acc);box-shadow:0 0 12px var(--acc)}

/* ---------- sheet / modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.68);backdrop-filter:blur(3px);z-index:90;opacity:0;
  pointer-events:none;transition:.25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:100;max-width:520px;margin:0 auto;
  background:var(--bg2);border:1px solid var(--line);border-bottom:none;border-radius:26px 26px 0 0;
  transform:translateY(102%);transition:transform .32s cubic-bezier(.32,.72,0,1);
  max-height:92vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.sheet.on{transform:none}
.sheet-h{padding:14px 18px 10px;flex:none;position:relative}
.sheet-h::before{content:'';position:absolute;top:7px;left:50%;transform:translateX(-50%);width:38px;height:4px;
  border-radius:99px;background:var(--line)}
.sheet-h h3{font-size:19px;margin-top:6px}
.sheet-h .x{position:absolute;right:14px;top:16px;width:30px;height:30px;border-radius:9px;background:var(--surface);
  border:1px solid var(--line);color:var(--mut);display:grid;place-items:center;font-size:15px;cursor:pointer}
.sheet-b{padding:4px 18px 22px;overflow-y:auto;-webkit-overflow-scrolling:touch}

/* ---------- chat ---------- */
#v-coach{display:none;flex-direction:column;height:calc(100vh - var(--nav-h) - 62px - env(safe-area-inset-top))}
#v-coach.on{display:flex}
.chat-log{flex:1;overflow-y:auto;padding:6px 2px 12px;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
.msg{max-width:88%;padding:11px 14px;border-radius:16px;font-size:14.3px;line-height:1.5;word-wrap:break-word;animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
.msg.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px}
.msg.me{align-self:flex-end;background:linear-gradient(100deg,var(--acc),color-mix(in srgb,var(--acc) 70%,var(--acc2)));color:#fff;border-bottom-right-radius:5px}
.msg.sys{align-self:center;background:color-mix(in srgb,var(--ok) 12%,transparent);border:1px solid color-mix(in srgb,var(--ok) 32%,transparent);
  color:var(--ok);font-size:12px;font-weight:600;padding:7px 13px;border-radius:99px;max-width:94%;text-align:center}
.msg strong{color:var(--acc)} .msg.me strong{color:#fff}
.msg ul{margin:7px 0;padding-left:19px} .msg li{margin:3px 0}
.msg code{background:var(--bg);padding:1px 5px;border-radius:5px;font-size:12.5px}
.typing{display:flex;gap:4px;padding:14px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--mut);animation:bl 1.3s infinite}
.typing i:nth-child(2){animation-delay:.18s} .typing i:nth-child(3){animation-delay:.36s}
@keyframes bl{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
.quicks{display:flex;gap:7px;overflow-x:auto;padding:8px 0 6px;scrollbar-width:none;flex:none}
.quicks::-webkit-scrollbar{display:none}
.chat-in{flex:none;display:flex;gap:8px;align-items:flex-end;padding:8px 0 10px;
  background:var(--bg);border-top:1px solid var(--line)}
.chat-in textarea{resize:none;max-height:120px;min-height:46px;border-radius:14px;padding:12px 13px}

/* ---------- misc ---------- */
.tag{display:inline-block;padding:3px 8px;border-radius:7px;font-size:10px;font-weight:800;
  text-transform:uppercase;letter-spacing:.08em}
.tag.pr{background:color-mix(in srgb,var(--acc2) 18%,transparent);color:var(--acc2)}
.tag.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.tag.mut{background:var(--surface2);color:var(--mut)}
.divider{height:1px;background:var(--line);margin:16px 0}
.toast{position:fixed;bottom:calc(var(--nav-h) + 14px);left:50%;transform:translateX(-50%) translateY(20px);
  z-index:200;background:var(--surface2);border:1px solid var(--acc);color:var(--txt);padding:11px 18px;
  border-radius:14px;font-size:13.5px;font-weight:600;opacity:0;transition:.28s;pointer-events:none;
  box-shadow:0 10px 34px -10px #000;max-width:86vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
canvas{max-width:100%}
/* Chart.js with maintainAspectRatio:false sizes the canvas to its parent.
   If that parent is height:auto the canvas grows the parent, which regrows the
   canvas, forever. Every chart lives in one of these fixed-height boxes. */
.chart{position:relative;width:100%;overflow:hidden}
.chart>canvas{position:absolute!important;top:0;left:0;display:block;
  width:100%!important;height:100%!important}
.set-row{display:grid;grid-template-columns:26px 1fr 1fr 40px;gap:8px;align-items:center;margin-bottom:8px}
.set-row .n{font-family:var(--font-d);color:var(--dim);text-align:center;font-size:15px}
.set-row input{padding:10px;text-align:center;font-weight:700}
.set-row .dn{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:var(--surface2);
  border:1px solid var(--line);cursor:pointer;font-size:14px;color:var(--dim)}
.set-row .dn.on{background:color-mix(in srgb,var(--ok) 18%,transparent);border-color:var(--ok);color:var(--ok)}
.timer-bar{position:fixed;bottom:var(--nav-h);left:0;right:0;max-width:520px;margin:0 auto;z-index:45;
  background:linear-gradient(100deg,var(--acc),color-mix(in srgb,var(--acc) 60%,var(--acc2)));
  padding:10px 16px;display:none;align-items:center;justify-content:space-between;color:#fff;font-weight:700}
.timer-bar.on{display:flex}
.sw{position:relative;width:46px;height:27px;flex:none}
.sw input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:2}
.sw i{position:absolute;inset:0;background:var(--surface2);border:1px solid var(--line);border-radius:99px;transition:.2s}
.sw i::after{content:'';position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:var(--mut);transition:.2s}
.sw input:checked + i{background:color-mix(in srgb,var(--acc) 30%,transparent);border-color:var(--acc)}
.sw input:checked + i::after{transform:translateX(19px);background:var(--acc)}
.notice{font-size:11.5px;color:var(--dim);line-height:1.5;margin-top:8px}
/* ---------- label scan ---------- */
.scan-img{display:block;width:100%;height:148px;object-fit:cover;border-radius:14px;
  border:1px solid var(--line);margin:2px 0 14px}
.scan-out{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.scan-out .k{font-family:var(--font-d);font-size:31px;line-height:1}
.scan-out .k small{font-family:var(--font-b);font-size:11.5px;color:var(--dim);font-weight:600;margin-left:4px}
.scan-out .m{display:flex;gap:16px;margin-top:9px;font-size:12.5px;color:var(--dim)}
.scan-out .m b{color:var(--txt);font-weight:700}
.scan-wait{display:flex;flex-direction:column;align-items:center;gap:8px;padding:30px 0 34px;
  color:var(--mut);font-size:13px;text-align:center}
.kb{flex:none;margin:2px 0 8px;padding:12px 14px;border-radius:15px;display:flex;align-items:center;gap:11px;
  background:linear-gradient(100deg,color-mix(in srgb,var(--acc) 16%,var(--surface)),var(--surface));
  border:1px solid color-mix(in srgb,var(--acc) 40%,transparent);cursor:pointer}
.kb .kbi{font-size:20px;flex:none}
.kb b{display:block;font-size:13px}
.kb small{color:var(--mut);font-size:11.5px;line-height:1.35;display:block}
.kb .go{flex:none;color:var(--acc);font-weight:800;font-size:12px;letter-spacing:.05em}
.step{display:flex;gap:12px;margin-bottom:16px;align-items:flex-start}
.step .sn{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:color-mix(in srgb,var(--acc) 20%,transparent);border:1px solid var(--acc);color:var(--acc);
  font-family:var(--font-d);font-size:14px;line-height:1}
.step .st{flex:1;font-size:13.5px;line-height:1.5;color:var(--mut)}
.step .st b{color:var(--txt);display:block;font-size:14px;margin-bottom:2px}
a.lk{color:var(--acc);font-weight:700;text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--acc) 45%,transparent)}
.keyres{padding:11px 13px;border-radius:12px;font-size:12.5px;font-weight:600;margin-top:10px;line-height:1.45}
.keyres.ok{background:color-mix(in srgb,var(--ok) 13%,transparent);border:1px solid color-mix(in srgb,var(--ok) 35%,transparent);color:var(--ok)}
.keyres.err{background:color-mix(in srgb,var(--bad) 13%,transparent);border:1px solid color-mix(in srgb,var(--bad) 35%,transparent);color:var(--bad)}
.keyres.wait{background:var(--surface2);border:1px solid var(--line);color:var(--mut)}
.msg .cta{display:inline-block;margin-top:8px;padding:9px 14px;border-radius:11px;font-size:13px;font-weight:700;
  background:linear-gradient(100deg,var(--acc),var(--acc2));color:#fff;cursor:pointer;border:none}
.exlib{max-height:44vh;overflow-y:auto}
#customCSS{}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo" id="appName">IRONFORGE</div>

<script>
/* ============================================================
   IRONFORGE — single-file training / nutrition / life tracker
   All data lives in this browser (localStorage). Nothing leaves
   the device unless an AI key is configured by the user.
   ============================================================ */

const KEY='ironforge.v1';
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const uid=()=>Math.random().toString(36).slice(2,10);
const todayISO=()=>new Date().toLocaleDateString('en-CA');
const isoOf=d=>new Date(d).toLocaleDateString('en-CA');
const round=(n,d=0)=>{const p=10**d;return Math.round((+n||0)*p)/p};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const daysAgo=n=>{const d=new Date();d.setDate(d.getDate()-n);return isoOf(d)};
const fmtDate=iso=>{const d=new Date(iso+'T12:00:00');
  return d.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'})};

/* ---------------- default state ---------------- */
function blank(){return{
  v:1,
  profile:{name:'',age:null,sex:'',heightCm:null,weightKg:null,goal:'',activity:'',
           experience:'',daysPerWeek:null,targetWeightKg:null,injuries:'',diet:'',onboarded:false},
  targets:{kcal:2400,protein:160,carbs:260,fat:75,water:3,sleep:8,steps:8000},
  settings:{units:'metric',appName:'IRONFORGE',accent:'#ff4d1f',accent2:'#ffb020',
            bg:'#08090c',surface:'#111319',restSec:90,provider:'none',apiKey:'',
            model:'',customCSS:'',cards:['rings','today','volume','weight','muscle','habits','prs'],
            hidden:[]},
  workouts:[],meals:[],body:[],habits:{},
  customHabits:[
    {id:'water',name:'Water',unit:'L',target:3,icon:'💧'},
    {id:'sleep',name:'Sleep',unit:'h',target:8,icon:'😴'},
    {id:'steps',name:'Steps',unit:'',target:8000,icon:'👟'},
    {id:'mood',name:'Mood',unit:'/5',target:5,icon:'🙂'}
  ],
  trackers:[],           // user-defined metrics {id,name,unit,icon}
  trackerLogs:{},        // {trackerId:{iso:value}}
  exercises:null,        // filled from library on first run
  chat:[],docs:[],prs:{},
  scans:[],               // remembered scanned labels {name,unit,servingLabel,servingGrams,per100,perServing}
  session:null,          // live workout
  onboardStep:-1
}}

let S=blank();

/* ---------------- persistence ---------------- */
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){console.warn('save failed',e)}}
function load(){
  try{const raw=localStorage.getItem(KEY);if(!raw)return false;
    const p=JSON.parse(raw);S=deepMerge(blank(),p);return true}
  catch(e){console.warn('load failed',e);return false}
}
function deepMerge(base,over){
  if(Array.isArray(base))return Array.isArray(over)?over:base;
  if(base&&typeof base==='object'&&over&&typeof over==='object'){
    const out={...base};for(const k in over){out[k]=k in base?deepMerge(base[k],over[k]):over[k]}
    return out}
  return over===undefined?base:over;
}

/* ---------------- exercise library ---------------- */
const LIB=[
 ['Barbell Bench Press','Chest'],['Incline Dumbbell Press','Chest'],['Dumbbell Fly','Chest'],
 ['Cable Crossover','Chest'],['Push-Up','Chest'],['Dip','Chest'],
 ['Back Squat','Legs'],['Front Squat','Legs'],['Leg Press','Legs'],['Romanian Deadlift','Legs'],
 ['Leg Extension','Legs'],['Leg Curl','Legs'],['Walking Lunge','Legs'],['Bulgarian Split Squat','Legs'],
 ['Calf Raise','Legs'],['Hip Thrust','Legs'],
 ['Deadlift','Back'],['Pull-Up','Back'],['Chin-Up','Back'],['Lat Pulldown','Back'],
 ['Barbell Row','Back'],['Dumbbell Row','Back'],['Seated Cable Row','Back'],['Face Pull','Back'],
 ['T-Bar Row','Back'],['Shrug','Back'],
 ['Overhead Press','Shoulders'],['Dumbbell Shoulder Press','Shoulders'],['Lateral Raise','Shoulders'],
 ['Rear Delt Fly','Shoulders'],['Arnold Press','Shoulders'],['Upright Row','Shoulders'],
 ['Barbell Curl','Arms'],['Dumbbell Curl','Arms'],['Hammer Curl','Arms'],['Preacher Curl','Arms'],
 ['Cable Curl','Arms'],['Tricep Pushdown','Arms'],['Skullcrusher','Arms'],['Overhead Tricep Ext','Arms'],
 ['Close-Grip Bench','Arms'],
 ['Plank','Core'],['Hanging Leg Raise','Core'],['Cable Crunch','Core'],['Ab Wheel','Core'],
 ['Russian Twist','Core'],['Dead Bug','Core'],
 ['Treadmill Run','Cardio'],['Cycling','Cardio'],['Rowing Machine','Cardio'],['Stairmaster','Cardio'],
 ['Elliptical','Cardio'],['Jump Rope','Cardio'],['Incline Walk','Cardio'],['Swimming','Cardio']
].map(([name,muscle])=>({name,muscle}));

const MUSCLES=['Chest','Back','Legs','Shoulders','Arms','Core','Cardio'];
const MUSCLE_ICON={Chest:'🫀',Back:'🔙',Legs:'🦵',Shoulders:'🏔',Arms:'💪',Core:'🎯',Cardio:'🏃'};

/* ---------------- common foods ---------------- */
const FOODS=[
 ['Chicken breast 150g',248,46.5,0,5.4],['Whole eggs (3)',234,19,1.6,16],
 ['White rice 1 cup ckd',205,4.3,45,0.4],['Oats 60g',228,8.4,38,4.2],
 ['Whey shake (1 scoop)',120,24,3,1.5],['Greek yogurt 200g',146,20,8,4],
 ['Salmon 150g',309,34,0,18],['Banana',105,1.3,27,0.4],
 ['Sweet potato 200g',180,4,41,0.2],['Almonds 30g',174,6.4,6,15],
 ['Beef mince 5% 150g',204,31,0,8.6],['Pasta 100g dry',371,13,74,1.5],
 ['Peanut butter 32g',188,8,6,16],['Tuna can 145g',191,42,0,1.4],
 ['Avocado half',160,2,9,15],['Olive oil 1 tbsp',119,0,0,13.5],
 ['Cottage cheese 200g',196,22,7,8],['Protein bar',210,20,22,7]
].map(([name,kcal,p,c,f])=>({name,kcal,p,c,f}));

/* ---------------- fitness math ---------------- */
const ACT={sedentary:1.2,light:1.375,moderate:1.55,high:1.725,athlete:1.9};
function bmr(){const p=S.profile;
  if(!p.weightKg||!p.heightCm||!p.age)return null;
  const s=p.sex==='female'?-161:5;
  return Math.round(10*p.weightKg+6.25*p.heightCm-5*p.age+s)}
function tdee(){const b=bmr();if(!b)return null;
  return Math.round(b*(ACT[S.profile.activity]||1.375))}
function bmi(){const p=S.profile;if(!p.weightKg||!p.heightCm)return null;
  return round(p.weightKg/((p.heightCm/100)**2),1)}
function recalcTargets(){
  const t=tdee();if(!t)return false;
  const g=S.profile.goal;
  let kcal=t;
  if(g==='cut')kcal=Math.round(t-500);
  else if(g==='bulk')kcal=Math.round(t+350);
  else if(g==='recomp')kcal=Math.round(t-150);
  const w=S.profile.weightKg||75;
  const protein=Math.round(w*(g==='cut'?2.2:1.9));
  const fat=Math.round(w*0.9);
  const carbs=Math.max(50,Math.round((kcal-protein*4-fat*9)/4));
  S.targets={...S.targets,kcal,protein,carbs,fat,
    water:round(clamp(w*0.035,2,5),1)};
  return true;
}
function e1rm(w,r){w=+w||0;r=+r||0;if(!w||!r)return 0;return Math.round(w*(1+r/30))}

/* ---------------- derived data ---------------- */
function mealsOn(iso){return S.meals.filter(m=>m.date===iso)}
function dayMacros(iso){
  return mealsOn(iso).reduce((a,m)=>({kcal:a.kcal+(+m.kcal||0),p:a.p+(+m.p||0),
    c:a.c+(+m.c||0),f:a.f+(+m.f||0)}),{kcal:0,p:0,c:0,f:0});
}
function workoutVolume(w){
  return (w.exercises||[]).reduce((t,e)=>t+(e.sets||[]).reduce((s,st)=>
    s+((+st.w||0)*(+st.r||0)),0),0)}
function workoutSets(w){return (w.exercises||[]).reduce((t,e)=>t+(e.sets||[]).length,0)}
function volumeByWeek(n=8){
  const out=[];
  for(let i=n-1;i>=0;i--){
    const end=new Date();end.setDate(end.getDate()-i*7);
    const start=new Date(end);start.setDate(start.getDate()-6);
    const a=isoOf(start),b=isoOf(end);
    const ws=S.workouts.filter(w=>w.date>=a&&w.date<=b);
    out.push({label:i===0?'This wk':`W-${i}`,vol:Math.round(ws.reduce((t,w)=>t+workoutVolume(w),0)),n:ws.length});
  }
  return out;
}
function muscleSplit(days=30){
  const from=daysAgo(days);const m={};MUSCLES.forEach(x=>m[x]=0);
  S.workouts.filter(w=>w.date>=from).forEach(w=>(w.exercises||[]).forEach(e=>{
    const mu=e.muscle||(LIB.find(l=>l.name===e.name)||{}).muscle||'Other';
    if(m[mu]===undefined)m[mu]=0;
    m[mu]+=(e.sets||[]).length;
  }));
  return m;
}
function bodySeries(field='weightKg',n=90){
  const from=daysAgo(n);
  return S.body.filter(b=>b.date>=from&&b[field]!=null).sort((a,b)=>a.date<b.date?-1:1)
    .map(b=>({x:b.date,y:+b[field]}));
}
function movingAvg(arr,k=7){
  return arr.map((p,i)=>{const s=arr.slice(Math.max(0,i-k+1),i+1);
    return{x:p.x,y:round(s.reduce((t,q)=>t+q.y,0)/s.length,2)}});
}
function streak(){
  let n=0;
  for(let i=0;i<400;i++){
    const d=daysAgo(i);
    const active=S.workouts.some(w=>w.date===d)||mealsOn(d).length>0||
                 (S.habits[d]&&Object.values(S.habits[d]).some(v=>+v>0));
    if(active)n++;else if(i>0)break;else continue;
  }
  return n;
}
function checkPR(name,w,r){
  const est=e1rm(w,r);if(!est)return false;
  const cur=S.prs[name];
  if(!cur||est>cur.e1rm){S.prs[name]={e1rm:est,w:+w,r:+r,date:todayISO()};return true}
  return false;
}
function habitVal(iso,id){return (S.habits[iso]||{})[id]??0}
function setHabit(iso,id,v){if(!S.habits[iso])S.habits[iso]={};S.habits[iso][id]=+v||0;save()}

/* ============================================================
   UI CORE
   ============================================================ */
const UI={
  view:'home',
  go(v){
    UI.view=v;
    $$('.view').forEach(e=>e.classList.toggle('on',e.id==='v-'+v));
    $$('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
    window.scrollTo({top:0,behavior:'instant'});
    Render[v]&&Render[v]();
  },
  toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');
    clearTimeout(UI._tt);UI._tt=setTimeout(()=>t.classList.remove('on'),2400)},
  sheet(title,html){
    $('#sheetT').textContent=title;$('#sheetB').innerHTML=html;
    $('#scrim').classList.add('on');$('#sheet').classList.add('on');
  },
  closeSheet(){$('#scrim').classList.remove('on');$('#sheet').classList.remove('on')},
  applyTheme(){
    const s=S.settings,r=document.documentElement.style;
    r.setProperty('--acc',s.accent);r.setProperty('--acc2',s.accent2);
    r.setProperty('--bg',s.bg);r.setProperty('--surface',s.surface);
    document.querySelector('meta[name=theme-color]').setAttribute('content',s.bg);
    $('#appName').textContent=s.appName||'IRONFORGE';
    document.title=s.appName||'IRONFORGE';
    let tag=$('#userCSS');
    if(!tag){tag=document.createElement('style');tag.id='userCSS';document.head.appendChild(tag)}
    tag.textContent=s.customCSS||'';
  },
  refresh(){UI.applyTheme();$('#streakN').textContent=streak();Render[UI.view]&&Render[UI.view]()}
};

/* chart helpers -------------------------------------------------- */
const CH={};
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
function mkChart(id,cfg){
  const el=document.getElementById(id);if(!el||!window.Chart)return;
  if(CH[id]){CH[id].destroy();delete CH[id]}
  Chart.defaults.font.family="'Inter',sans-serif";
  Chart.defaults.color=css('--mut');Chart.defaults.font.size=10;
  /* safety net: a chart in an auto-height parent feeds its own size back into
     the layout and grows without limit, so pin the parent before drawing. */
  const box=el.parentElement;
  if(box&&!box.classList.contains('chart')){
    box.classList.add('chart');
    if(!box.style.height)box.style.height=(el.getAttribute('height')||150)+'px';
  }
  cfg.options=Object.assign({responsive:true,maintainAspectRatio:false,resizeDelay:120},cfg.options);
  CH[id]=new Chart(el,cfg);
}
const gridCfg=()=>({grid:{color:css('--line'),drawBorder:false},
  ticks:{color:css('--dim'),font:{size:9.5}},border:{display:false}});

/* ============================================================
   RENDERERS
   ============================================================ */
const Render={};

Render.home=function(){
  const p=S.profile,iso=todayISO(),m=dayMacros(iso),t=S.targets;
  const wkThis=S.workouts.filter(w=>w.date>=daysAgo(6)).length;
  const lastB=[...S.body].sort((a,b)=>a.date<b.date?1:-1)[0];
  const prevB=[...S.body].sort((a,b)=>a.date<b.date?1:-1)[1];
  const wDelta=lastB&&prevB?round(lastB.weightKg-prevB.weightKg,1):null;
  const vol7=S.workouts.filter(w=>w.date>=daysAgo(6)).reduce((a,w)=>a+workoutVolume(w),0);
  const water=habitVal(iso,'water'),sleep=habitVal(iso,'sleep');
  const hour=new Date().getHours();
  const greet=hour<12?'Good morning':hour<18?'Good afternoon':'Good evening';
  const hidden=S.settings.hidden||[];
  const show=id=>!hidden.includes(id);

  const ring=(pct,val,unit,label,color)=>{
    const R=32,C=2*Math.PI*R,off=C*(1-clamp(pct,0,1));
    return `<div class="ring"><div class="rw">
      <svg width="78" height="78" viewBox="0 0 78 78">
        <circle cx="39" cy="39" r="${R}" fill="none" stroke="${css('--surface2')||'#171a22'}" stroke-width="7"/>
        <circle cx="39" cy="39" r="${R}" fill="none" stroke="${color}" stroke-width="7"
          stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}"
          style="transition:stroke-dashoffset .7s cubic-bezier(.4,0,.2,1)"/>
      </svg>
      <div class="rc"><div><b>${val}</b><i style="display:block">${unit}</i></div></div>
      </div><div class="lbl">${label}</div></div>`;
  };

  let h=`
  <div class="hero">
    <div class="greet">${greet}</div>
    <div class="name">${p.name?esc(p.name).toUpperCase():'ATHLETE'}<b>.</b></div>
    <div class="grid3">
      <div><div class="k" style="font-size:10px;color:var(--dim);letter-spacing:.11em;font-weight:700;text-transform:uppercase">Goal</div>
        <div class="disp" style="font-size:19px">${(p.goal||'—').toUpperCase()}</div></div>
      <div><div class="k" style="font-size:10px;color:var(--dim);letter-spacing:.11em;font-weight:700;text-transform:uppercase">TDEE</div>
        <div class="disp" style="font-size:19px">${tdee()||'—'}</div></div>
      <div><div class="k" style="font-size:10px;color:var(--dim);letter-spacing:.11em;font-weight:700;text-transform:uppercase">Sessions/wk</div>
        <div class="disp" style="font-size:19px">${wkThis}</div></div>
    </div>
  </div>`;

  if(show('rings')) h+=`
  <div class="card"><div class="rings">
    ${ring(m.kcal/(t.kcal||1),Math.round(m.kcal),'kcal','Energy',css('--acc'))}
    ${ring(m.p/(t.protein||1),Math.round(m.p),'g','Protein',css('--acc2'))}
    ${ring(water/(t.water||1),round(water,1),'L','Water',css('--acc3'))}
  </div>
  <div class="divider"></div>
  ${['protein','carbs','fat'].map(k=>{
    const cur=k==='protein'?m.p:k==='carbs'?m.c:m.f, tgt=t[k]||1;
    return `<div class="macro-row"><div class="lb"><span>${k[0].toUpperCase()+k.slice(1)}</span>
      <span>${Math.round(cur)} / ${tgt}g</span></div>
      <div class="pbar"><i style="width:${clamp(cur/tgt*100,0,100)}%"></i></div></div>`}).join('')}
  </div>`;

  if(show('today')) h+=`
  <div class="grid2">
    <div class="stat"><div class="k">Weight</div>
      <div class="v">${lastB?round(lastB.weightKg,1):(p.weightKg?round(p.weightKg,1):'—')}<small>kg</small></div>
      <div class="d ${wDelta>0?'down':wDelta<0?'up':''}">${wDelta!=null?(wDelta>0?'▲ +':'▼ ')+round(Math.abs(wDelta),1)+' kg':'no trend yet'}</div></div>
    <div class="stat"><div class="k">7-Day Volume</div>
      <div class="v">${(vol7/1000>=10?round(vol7/1000,0):round(vol7/1000,1))}<small>t</small></div>
      <div class="d">${S.workouts.filter(w=>w.date>=daysAgo(6)).reduce((a,w)=>a+workoutSets(w),0)} sets logged</div></div>
    <div class="stat"><div class="k">Calories left</div>
      <div class="v">${Math.max(0,Math.round((t.kcal||0)-m.kcal))}<small>kcal</small></div>
      <div class="d">${Math.round(m.kcal)} of ${t.kcal} eaten</div></div>
    <div class="stat"><div class="k">Sleep</div>
      <div class="v">${round(sleep,1)}<small>h</small></div>
      <div class="d">target ${t.sleep}h</div></div>
  </div>`;

  if(show('volume')) h+=`
  <div class="card"><div class="card-t">Weekly training volume<span style="color:var(--dim);font-size:11px">kg lifted</span></div>
    <div class="chart" style="height:150px"><canvas id="cVol"></canvas></div></div>`;

  if(show('weight')) h+=`
  <div class="card"><div class="card-t">Bodyweight trend<span style="color:var(--dim);font-size:11px">90 days</span></div>
    <div class="chart" style="height:150px"><canvas id="cWeight"></canvas></div></div>`;

  if(show('muscle')) h+=`
  <div class="card"><div class="card-t">Muscle split<span style="color:var(--dim);font-size:11px">sets · 30d</span></div>
    <div class="chart" style="height:185px"><canvas id="cMuscle"></canvas></div></div>`;

  if(show('habits')){
    h+=`<div class="sec-t"><h2>Daily habits</h2><span class="lnk" onclick="Habits.edit()">Edit</span></div><div class="card">`;
    S.customHabits.forEach(hb=>{
      const v=habitVal(iso,hb.id),pct=clamp(v/(hb.target||1)*100,0,100);
      h+=`<div class="li"><div class="ic">${hb.icon||'•'}</div>
        <div class="tx"><b>${esc(hb.name)}</b>
          <div class="pbar" style="margin-top:6px"><i style="width:${pct}%"></i></div></div>
        <div class="rt" style="display:flex;gap:6px;align-items:center">
          <span class="dn" style="width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--surface2);border:1px solid var(--line);cursor:pointer"
            onclick="Habits.bump('${hb.id}',-1)">−</span>
          <span style="min-width:46px">${round(v,1)}<small>${esc(hb.unit||'')}</small></span>
          <span class="dn" style="width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--surface2);border:1px solid var(--line);cursor:pointer"
            onclick="Habits.bump('${hb.id}',1)">+</span>
        </div></div>`;
    });
    h+=`</div>
    <div class="card"><div class="card-t">Consistency<span style="color:var(--dim);font-size:11px">last 8 weeks</span></div>
      <div class="heat-d">${['M','T','W','T','F','S','S'].map(d=>`<span>${d}</span>`).join('')}</div>
      <div class="heat" id="heat"></div></div>`;
  }

  if(show('prs')){
    const prs=Object.entries(S.prs).sort((a,b)=>b[1].e1rm-a[1].e1rm).slice(0,5);
    h+=`<div class="sec-t"><h2>Personal records</h2></div><div class="card">`;

function drawHeat(){
  const el=$('#heat');if(!el)return;
  const cells=[];const today=new Date();
  const dow=(today.getDay()+6)%7; // monday=0
  const total=56;
  for(let i=total-1-(6-dow);i>=-(6-dow);i--){}
  // build 8 weeks ending with current week (Mon..Sun)
  const start=new Date(today);start.setDate(start.getDate()-dow-49);
  for(let i=0;i<56;i++){
    const d=new Date(start);d.setDate(d.getDate()+i);
    const iso=isoOf(d);
    let score=0;
    if(S.workouts.some(w=>w.date===iso))score+=2;
    if(mealsOn(iso).length)score+=1;
    const hb=S.habits[iso]||{};
    if(Object.values(hb).some(v=>+v>0))score+=1;
    if(d>today)score=-1;
    cells.push(`<i data-l="${score<0?0:clamp(score,0,4)}" title="${iso}"></i>`);
  }
  el.innerHTML=cells.join('');
}

const Train={
  start(name){
    S.session={id:uid(),date:todayISO(),name:name||'Session '+(S.workouts.length+1),
      started:Date.now(),exercises:[],notes:''};
    save();Render.train();UI.toast('Session started 💪');
  },
  finish(){
    const s=S.session;if(!s)return;
    if(!s.exercises.length){S.session=null;save();Render.train();return UI.toast('Empty session discarded')}
    s.duration=Math.round((Date.now()-s.started)/60000);
    s.exercises.forEach(e=>e.sets.forEach(st=>{if(st.done&&st.w&&st.r)checkPR(e.name,st.w,st.r)}));
    S.workouts.unshift(s);S.session=null;Train.stopTimer();save();
    Render.train();UI.toast(`Session logged · ${round(workoutVolume(s)/1000,1)}t moved 🔥`);
  },
  discard(){if(confirm('Discard this session?')){S.session=null;Train.stopTimer();save();Render.train()}},
  addEx(name,muscle){
    if(!S.session)Train.start();
    const last=[...S.workouts].find(w=>w.exercises.some(e=>e.name===name));
    const prev=last&&last.exercises.find(e=>e.name===name);
    const seed=prev&&prev.sets.length?prev.sets.slice(0,3).map(s=>({w:s.w,r:s.r,done:false}))
      :[{w:'',r:'',done:false},{w:'',r:'',done:false},{w:'',r:'',done:false}];
    S.session.exercises.push({name,muscle,sets:seed});
    save();UI.closeSheet();Render.train();
  },
  rmEx(i){S.session.exercises.splice(i,1);save();Render.train()},
  addSet(i){const ex=S.session.exercises[i];const l=ex.sets[ex.sets.length-1]||{};
    ex.sets.push({w:l.w||'',r:l.r||'',done:false});save();Render.train()},
  rmSet(i,j){S.session.exercises[i].sets.splice(j,1);save();Render.train()},
  setVal(i,j,k,v){S.session.exercises[i].sets[j][k]=v;save()},
  toggleSet(i,j){
    const st=S.session.exercises[i].sets[j];st.done=!st.done;save();
    if(st.done){
      const nm=S.session.exercises[i].name;
      if(st.w&&st.r&&checkPR(nm,st.w,st.r)){UI.toast('🏆 NEW PR — '+nm);save()}
      Train.startTimer(S.settings.restSec);
    }
    Render.train();
  },
  _t:null,
  startTimer(sec){
    Train.stopTimer();let left=sec;
    $('#timerBar').classList.add('on');
    const tick=()=>{const m=Math.floor(left/60),s=left%60;
      $('#timerTxt').textContent=`${m}:${String(s).padStart(2,'0')}`;
      if(left--<=0){Train.stopTimer();UI.toast('Rest over — go 🔔');
        try{navigator.vibrate&&navigator.vibrate([120,60,120])}catch(e){}}};
    tick();Train._t=setInterval(tick,1000);
  },
  stopTimer(){clearInterval(Train._t);Train._t=null;$('#timerBar').classList.remove('on')},
  picker(){
    const groups={};LIB.concat(S.exercises||[]).forEach(e=>{(groups[e.muscle]=groups[e.muscle]||[]).push(e)});
    let h=`<div class="field"><input id="exSearch" placeholder="Search or type a new exercise…"
      oninput="Train.filter(this.value)"></div>
      <div style="margin-bottom:12px"><button class="btn btn-g btn-sm btn-w" onclick="Train.custom()">+ Add custom exercise</button></div>
      <div class="exlib" id="exList">`;
    Object.keys(groups).sort().forEach(mu=>{
      h+=`<div class="card-t" style="margin-top:12px">${MUSCLE_ICON[mu]||''} ${mu}</div>`;
      groups[mu].forEach(e=>{
        const pr=S.prs[e.name];
        h+=`<div class="li ex-item" data-n="${esc(e.name.toLowerCase())}" style="cursor:pointer"
          onclick="Train.addEx('${esc(e.name).replace(/'/g,"\\'")}','${mu}')">
          <div class="ic">${MUSCLE_ICON[mu]||'•'}</div>
          <div class="tx"><b>${esc(e.name)}</b>${pr?`<small>PR ${pr.w}kg × ${pr.r}</small>`:''}</div>
          <div class="rt" style="color:var(--acc);font-size:20px">+</div></div>`;
      });
    });
    h+=`</div>`;
    UI.sheet('Add exercise',h);
    setTimeout(()=>$('#exSearch')&&$('#exSearch').focus(),320);
  },
  filter(q){q=q.toLowerCase().trim();
    $$('.ex-item').forEach(el=>el.style.display=!q||el.dataset.n.includes(q)?'':'none')},
  custom(){
    const n=($('#exSearch')||{}).value||'';
    const name=prompt('Exercise name:',n);if(!name)return;
    const muscle=prompt('Muscle group ('+MUSCLES.join('/')+'):','Chest')||'Other';
    S.exercises=S.exercises||[];S.exercises.push({name,muscle});save();Train.addEx(name,muscle);
  },
  templates:{
    'Push':[['Barbell Bench Press','Chest'],['Incline Dumbbell Press','Chest'],['Overhead Press','Shoulders'],['Lateral Raise','Shoulders'],['Tricep Pushdown','Arms']],
    'Pull':[['Deadlift','Back'],['Pull-Up','Back'],['Barbell Row','Back'],['Face Pull','Shoulders'],['Barbell Curl','Arms']],
    'Legs':[['Back Squat','Legs'],['Romanian Deadlift','Legs'],['Leg Press','Legs'],['Leg Curl','Legs'],['Calf Raise','Legs']],
    'Upper':[['Barbell Bench Press','Chest'],['Barbell Row','Back'],['Overhead Press','Shoulders'],['Lat Pulldown','Back'],['Dumbbell Curl','Arms']],
    'Full body':[['Back Squat','Legs'],['Barbell Bench Press','Chest'],['Barbell Row','Back'],['Plank','Core']]
  },
  useTemplate(k){
    Train.start(k+' Day');
    Train.templates[k].forEach(([n,m])=>{
      const last=[...S.workouts].find(w=>w.exercises.some(e=>e.name===n));
      const prev=last&&last.exercises.find(e=>e.name===n);
      S.session.exercises.push({name:n,muscle:m,
        sets:prev&&prev.sets.length?prev.sets.slice(0,3).map(s=>({w:s.w,r:s.r,done:false}))
          :[{w:'',r:'',done:false},{w:'',r:'',done:false},{w:'',r:'',done:false}]});
    });
    save();Render.train();
  },
  detail(id){
    const w=S.workouts.find(x=>x.id===id);if(!w)return;
    let h=`<div class="spread" style="margin-bottom:14px">
      <div><div class="disp" style="font-size:22px">${esc(w.name)}</div>
      <div style="color:var(--dim);font-size:12px">${fmtDate(w.date)} · ${w.duration||'—'} min</div></div>
      <div style="text-align:right"><div class="disp" style="font-size:22px;color:var(--acc)">${round(workoutVolume(w)/1000,1)}t</div>
      <div style="color:var(--dim);font-size:12px">${workoutSets(w)} sets</div></div></div>`;
    (w.exercises||[]).forEach(e=>{
      h+=`<div class="card tight"><div class="card-t" style="margin-bottom:8px">${esc(e.name)}</div>
        ${(e.sets||[]).map((s,i)=>`<div class="spread" style="font-size:13px;padding:4px 0">
          <span style="color:var(--dim)">Set ${i+1}</span>
          <span class="mono"><b>${s.w||0}</b> kg × <b>${s.r||0}</b></span>
          <span style="color:var(--dim);font-size:11px">e1RM ${e1rm(s.w,s.r)}</span></div>`).join('')}
      </div>`;
    });
    if(w.notes)h+=`<div class="card tight"><div class="card-t">Notes</div>${esc(w.notes)}</div>`;
    h+=`<button class="btn btn-g btn-w" style="margin-top:8px;color:var(--bad)" onclick="Train.del('${id}')">Delete session</button>`;
    UI.sheet('Session detail',h);
  },
  del(id){S.workouts=S.workouts.filter(w=>w.id!==id);save();UI.closeSheet();Render.train();UI.toast('Deleted')}
};

Render.train=function(){
  let h='';
  if(S.session){
    const s=S.session;
    h+=`<div class="hero" style="padding:16px">
      <div class="spread"><div>
        <div class="greet">Live session</div>
        <div class="name" style="font-size:24px;margin-bottom:0">${esc(s.name)}</div></div>
        <div style="text-align:right"><div class="disp" style="font-size:24px;color:var(--acc)">${round(workoutVolume(s)/1000,1)}t</div>
        <div style="font-size:11px;color:var(--mut)">${workoutSets(s)} sets</div></div></div></div>`;
    s.exercises.forEach((e,i)=>{
      h+=`<div class="card"><div class="card-t">
        <span>${MUSCLE_ICON[e.muscle]||''} ${esc(e.name)}</span>
        <span onclick="Train.rmEx(${i})" style="cursor:pointer;color:var(--dim)">✕</span></div>
        <div class="set-row" style="margin-bottom:6px">
          <span class="n" style="font-size:10px">#</span>
          <span style="font-size:10px;color:var(--dim);text-align:center;text-transform:uppercase;letter-spacing:.08em;font-weight:700">kg</span>
          <span style="font-size:10px;color:var(--dim);text-align:center;text-transform:uppercase;letter-spacing:.08em;font-weight:700">reps</span>
          <span></span></div>`;
      e.sets.forEach((st,j)=>{
        h+=`<div class="set-row">
          <span class="n">${j+1}</span>
          <input type="number" inputmode="decimal" value="${st.w??''}" placeholder="0"
            onchange="Train.setVal(${i},${j},'w',this.value)">
          <input type="number" inputmode="numeric" value="${st.r??''}" placeholder="0"
            onchange="Train.setVal(${i},${j},'r',this.value)">
          <div class="dn ${st.done?'on':''}" onclick="Train.toggleSet(${i},${j})">✓</div>
        </div>`;
      });
      h+=`<div class="row" style="margin-top:6px">
        <button class="btn btn-g btn-sm" style="flex:1" onclick="Train.addSet(${i})">+ Set</button>
        <button class="btn btn-g btn-sm" style="flex:1" onclick="Train.rmSet(${i},${e.sets.length-1})">− Set</button>
      </div></div>`;
    });
    h+=`<button class="btn btn-g btn-w" onclick="Train.picker()">+ Add exercise</button>
      <div class="row" style="margin-top:10px">
        <button class="btn btn-p" style="flex:2" onclick="Train.finish()">Finish session</button>
        <button class="btn btn-g" style="flex:1" onclick="Train.discard()">Discard</button>
      </div><div style="height:14px"></div>`;
  }else{
    h+=`<div class="card" style="text-align:center;padding:22px">
      <div class="disp" style="font-size:20px;margin-bottom:4px">Ready to work</div>
      <div style="color:var(--mut);font-size:13px;margin-bottom:14px">Pick a template or build it as you go.</div>
      <button class="btn btn-p btn-w" onclick="Train.start()">Start empty session</button></div>
      <div class="sec-t"><h2>Templates</h2></div>
      <div class="chips" style="margin-bottom:6px">
        ${Object.keys(Train.templates).map(k=>`<span class="chip" onclick="Train.useTemplate('${k}')">${k}</span>`).join('')}
      </div>`;
  }

  h+=`<div class="sec-t"><h2>History</h2><span class="lnk">${S.workouts.length} total</span></div><div class="card">`;
  if(!S.workouts.length){
    h+=`<div class="empty"><div class="e">🏋️</div><p>No sessions yet. Your history and PRs build from here.</p></div>`;
  }else{
    S.workouts.slice(0,25).forEach(w=>{
      h+=`<div class="li" style="cursor:pointer" onclick="Train.detail('${w.id}')">
        <div class="ic">${MUSCLE_ICON[(w.exercises[0]||{}).muscle]||'🏋'}</div>
        <div class="tx"><b>${esc(w.name)}</b><small>${fmtDate(w.date)} · ${w.exercises.length} exercises · ${workoutSets(w)} sets</small></div>
        <div class="rt">${round(workoutVolume(w)/1000,1)}<small>tonnes</small></div></div>`;
    });
  }
  h+=`</div><div style="height:8px"></div>`;
  $('#v-train').innerHTML=h;
};

const Habits={
  bump(id,dir){

    const step=hb.id==='steps'?500:hb.id==='water'?0.25:hb.id==='sleep'?0.5:1;
    const iso=todayISO();
    setHabit(iso,id,clamp(round(habitVal(iso,id)+dir*step,2),0,999999));
    Render.home();
  },
  edit(){
    let h=`<div class="notice" style="margin-bottom:12px">Track anything you want — sets of stairs, meditation minutes, cigarettes avoided. Your call.</div>`;

        <div class="card-t">Custom metric trackers</div>

  rm(id){S.customHabits=S.customHabits.filter(x=>x.id!==id);save();Habits.edit();Render.home()},

      target:+prompt('Daily target:','1')||1,icon:prompt('Emoji icon:','✅')||'✅'});

      kcal:+$('#fK').value||0,p:+$('#fP').value||0,c:+$('#fC').value||0,f:+$('#fF').value||0,
      meal:$('#fM').value});
    save();UI.closeSheet();Render.fuel();UI.toast('Logged '+name);
  },
  quick(){
    let h=`<div class="field"><input id="qs" placeholder="Search foods…" oninput="Fuel.filter(this.value)"></div><div class="exlib">`;
    (S.scans||[]).forEach((f,i)=>{
      const b=f.perServing||f.per100;
      h+=`<div class="li food-item" data-n="${esc(f.name.toLowerCase())}" style="cursor:pointer" onclick="Scan.reuse(${i})">
        <div class="ic">📷</div><div class="tx"><b>${esc(f.name)}</b>
        <small>Scanned · ${f.perServing?esc(f.servingLabel||'per serving'):'per 100'+(f.unit||'g')}</small></div>
        <div class="rt">${Math.round(b.kcal)}<small>kcal</small></div></div>`;
    });
    FOODS.forEach((f,i)=>{
      h+=`<div class="li food-item" data-n="${esc(f.name.toLowerCase())}" style="cursor:pointer" onclick="Fuel.pick(${i})">
        <div class="ic">🍴</div><div class="tx"><b>${esc(f.name)}</b><small>P${f.p} · C${f.c} · F${f.f}</small></div>
        <div class="rt">${f.kcal}<small>kcal</small></div></div>`;
    });
    h+=`</div>`;UI.sheet('Quick add',h);
  },
  filter(q){q=q.toLowerCase().trim();
    $$('.food-item').forEach(el=>el.style.display=!q||el.dataset.n.includes(q)?'':'none')},
  pick(i){const f=FOODS[i];
    S.meals.unshift({id:uid(),date:Fuel.day,name:f.name,kcal:f.kcal,p:f.p,c:f.c,f:f.f,meal:'Snack'});
    save();UI.closeSheet();Render.fuel();UI.toast('Logged '+f.name)},
  del(id){S.meals=S.meals.filter(m=>m.id!==id);save();Render.fuel()},
  setDay(d){Fuel.day=d;Render.fuel()}
};

/* ============================================================
   LABEL SCAN — photograph a nutrition panel, log it
   ============================================================ */
const SCAN_PROMPT=`You are reading a photograph of a food product's nutrition information panel.
Reply with ONE JSON object and nothing else. No prose, no code fences.
{"ok":true,
 "name":"short product name",
 "basis":"100g" or "100ml" or "serving",
 "servingLabel":"1 bar (45 g)" or null,
 "servingGrams":number or null,
 "per100":{"kcal":n,"protein":n,"carbs":n,"fat":n} or null,
 "perServing":{"kcal":n,"protein":n,"carbs":n,"fat":n} or null,
 "estimated":false,
 "note":"one short caveat, or empty string"}

Rules:
- kJ is not kcal. If only kJ is printed, divide by 4.184.
- Carbs means total carbohydrate exactly as printed. Do not subtract fibre. Only use "of which sugars" if no total is printed.
- If the panel prints both per 100 g/ml and per serving, fill in both objects.
- servingGrams is the weight of one serving in grams (or ml for drinks), as a bare number.
- If no panel is readable, identify the food and estimate from typical values, and set "estimated":true.
- If the photo is unusable, reply {"ok":false,"note":"what went wrong"}.
- Number fields hold numbers only: no units, no ranges, no text.`;

/* Anthropic is the only provider that demands an explicit output cap; Gemini and
   OpenAI default to the model's own maximum when the field is left off. */
const MAXTOK=32000;

const MEALS=['Breakfast','Lunch','Dinner','Snack','Pre-workout','Post-workout'];
function mealNow(){const h=new Date().getHours();
  return h<11?'Breakfast':h<15?'Lunch':h<18?'Snack':'Dinner'}
function native(){try{return !!window.Capacitor?.isNativePlatform?.()}catch(e){return false}}

const Scan={
  data:null,img:null,mode:'serving',amt:1,dbg:null,

  /* ---- entry ---- */
  open(){
    if(!Scan.ready())return;
    /* inside the Android app the WebView only offers the camera when the input
       asks for it; in a browser the plain input gives the user the choice. */
    $(native()?'#labelCam':'#labelIn').click();
  },
  pick(){if(Scan.ready())$('#labelIn').click()},

  ready(){
    if(S.settings.provider!=='none'&&S.settings.apiKey)return true;
    UI.sheet('Scan a label',`
      <div style="font-size:12.5px;color:var(--mut);line-height:1.55;margin:0 0 16px">
        Reading a label needs an AI key. The photo goes straight from this browser to your own
        AI provider and is never stored anywhere else. A free Gemini key takes about a minute.</div>
      <button class="btn btn-p btn-w" onclick="Gem.wizard()">⚡ Connect Gemini — free</button>
      <button class="btn btn-g btn-w btn-sm" style="margin-top:9px" onclick="UI.closeSheet();Fuel.add()">Type it in instead</button>`);
    return false;
  },

  async file(f){
    if(!f)return;
    Scan.data=null;Scan.img=null;Scan.dbg=null;
    UI.sheet('Reading label',`<div class="scan-wait">
      <div class="typing"><i></i><i></i><i></i></div>Reading the panel…</div>`);
    try{
      const b64=await Scan.shrink(f);
      Scan.img='data:image/jpeg;base64,'+b64;
      UI.sheet('Reading label',`<img class="scan-img" src="${Scan.img}">
        <div class="scan-wait"><div class="typing"><i></i><i></i><i></i></div>Reading the panel…</div>`);
      const raw=await Scan.vision(b64);
      const j=grabJSON(raw);
      if(j.ok===false)throw new Error(j.note||'That photo could not be read.');
      Scan.data=Scan.norm(j);
      Scan.review();
    }catch(e){Scan.fail(e.message||String(e))}
  },

  fail(msg){
    const d=Scan.dbg||{};
    UI.sheet('Scan failed',`
      ${Scan.img?`<img class="scan-img" src="${Scan.img}">`:''}
      <div style="font-size:13px;color:var(--mut);line-height:1.55;margin-bottom:16px">${esc(msg)}</div>
      <div class="notice" style="margin:0 0 16px">Get the whole panel in frame, straight on, and make sure the
      numbers are in focus. Glossy packets do better without flash.</div>
      <button class="btn btn-p btn-w" onclick="Scan.open()">Take another photo</button>
      <button class="btn btn-g btn-w btn-sm" style="margin-top:9px" onclick="Scan.pick()">Use a photo from my gallery</button>
      <button class="btn btn-g btn-w btn-sm" style="margin-top:9px" onclick="UI.closeSheet();Fuel.add()">Type it in instead</button>
      <details style="margin-top:16px">
        <summary style="font-size:12px;color:var(--dim);cursor:pointer">Technical details</summary>
        <pre style="font-size:11px;color:var(--dim);white-space:pre-wrap;word-break:break-all;
          background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px">${
          esc(['provider: '+(d.provider||S.settings.provider),
               'model: '+(d.model||S.settings.model||'auto'),
               'finish: '+(d.finish||'—'),
               'error: '+msg,
               'reply: '+(d.raw||'(nothing)')].join('\n'))}</pre>
      </details>`);
  },

  /* ---- image -> small jpeg base64 ---- */
  async shrink(file,max=1280){
    let src;
    if(window.createImageBitmap){
      try{src=await createImageBitmap(file,{imageOrientation:'from-image'})}catch(e){src=null}
    }
    if(!src)src=await new Promise((res,rej)=>{
      const r=new FileReader();
      r.onerror=()=>rej(new Error('That file could not be opened.'));
      r.onload=()=>{const im=new Image();
        im.onload=()=>res(im);
        im.onerror=()=>rej(new Error('That file is not an image.'));
        im.src=r.result};
      r.readAsDataURL(file);
    });
    const w=src.width||src.naturalWidth,h=src.height||src.naturalHeight;
    if(!w||!h)throw new Error('That file is not an image.');
    const sc=Math.min(1,max/Math.max(w,h));
    const c=document.createElement('canvas');
    c.width=Math.round(w*sc);c.height=Math.round(h*sc);
    c.getContext('2d').drawImage(src,0,0,c.width,c.height);
    if(src.close)src.close();
    return c.toDataURL('image/jpeg',.82).split(',')[1];
  },

  /* ---- vision call, same providers as the coach ---- */
  async vision(b64){
    const s=S.settings;
    if(s.provider==='gemini'){
      const mk=extra=>JSON.stringify({contents:[{role:'user',parts:[
          {text:SCAN_PROMPT},{inline_data:{mime_type:'image/jpeg',data:b64}}]}],
        generationConfig:Object.assign({temperature:0},extra)});
      /* Flash models think by default and thinking tokens come out of the same
         budget as the answer — leave it on and the reply arrives empty. */
      const strict=mk({responseMimeType:'application/json',thinkingConfig:{thinkingBudget:0}}),
            plain =mk({});
      const call=async(model,body)=>{
        const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(s.apiKey)}`,
          {method:'POST',headers:{'Content-Type':'application/json'},body});
        return r.json();
      };
      let model=s.model||GEM_PREF[0];
      let j=await call(model,strict);
      /* older models reject thinkingConfig or the json mime type — retry bare */
      if(j.error&&/thinking|mime|Unknown name|INVALID_ARGUMENT|not supported/i.test(j.error.message||''))
        j=await call(model,plain);
      /* model renamed or retired? rediscover once and retry */
      if(j.error&&/not found|not supported|NOT_FOUND|404/i.test(j.error.message||'')){
        const found=Gem.pick(await Gem.listModels(s.apiKey));
        if(found&&found!==model){
          model=found;S.settings.model=found;save();
          j=await call(found,strict);
          if(j.error)j=await call(found,plain);
        }
      }
      Scan.dbg={model,provider:'gemini'};
      if(j.error)throw new Error(j.error.message);
      if(j.promptFeedback?.blockReason)throw new Error('Google blocked the image ('+j.promptFeedback.blockReason+').');
      const cand=j.candidates?.[0],fin=cand?.finishReason||'';
      Scan.dbg.finish=fin;
      const txt=(cand?.content?.parts||[]).filter(p=>!p.thought).map(p=>p.text||'').join('').trim();
      Scan.dbg.raw=txt.slice(0,400);
      if(!txt){
        if(/MAX_TOKENS/i.test(fin))throw new Error('The model ran out of response budget before it answered. Try again — if it keeps happening the model is thinking too much for this job.');
        if(/SAFETY|BLOCK|PROHIBITED|RECITATION/i.test(fin))throw new Error('Google blocked the reply ('+fin+').');
        throw new Error('Empty reply from '+model+(fin?' — finish reason '+fin:'')+'.');
      }
      return txt;
    }
    if(s.provider==='anthropic'){
      /* Anthropic requires max_tokens, so ask high and step down if the model
         has a lower ceiling than the one we asked for. */
      const send=async n=>{
        const r=await fetch('https://api.anthropic.com/v1/messages',{
          method:'POST',headers:{'Content-Type':'application/json','x-api-key':s.apiKey,
            'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
          body:JSON.stringify({model:s.model||'claude-haiku-4-5-20251001',max_tokens:n,
            messages:[{role:'user',content:[
              {type:'image',source:{type:'base64',media_type:'image/jpeg',data:b64}},
              {type:'text',text:SCAN_PROMPT}]}]})});
        return r.json();
      };
      let j=await send(MAXTOK);
      if(j.error&&/max_tokens/i.test(j.error.message||''))j=await send(4096);
      Scan.dbg={provider:'anthropic',model:j.model||s.model||'default',finish:j.stop_reason||''};
      if(j.error)throw new Error(j.error.message);
      const txt=(j.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('').trim();
      Scan.dbg.raw=txt.slice(0,400);
      if(!txt)throw new Error('Empty reply'+(j.stop_reason?' — stop reason '+j.stop_reason:'')+'.');
      return txt;
    }
    /* OpenAI: omitting the limit lets the model use its full output window */
    const r=await fetch('https://api.openai.com/v1/chat/completions',{
      method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.apiKey},
      body:JSON.stringify({model:s.model||'gpt-4o-mini',temperature:0,
        messages:[{role:'user',content:[{type:'text',text:SCAN_PROMPT},
          {type:'image_url',image_url:{url:'data:image/jpeg;base64,'+b64}}]}]})});
    const j=await r.json();
    Scan.dbg={provider:'openai',model:j.model||s.model||'default',finish:j.choices?.[0]?.finish_reason||''};
    if(j.error)throw new Error(j.error.message);
    const txt=(j.choices?.[0]?.message?.content||'').trim();
    Scan.dbg.raw=txt.slice(0,400);
    if(!txt)throw new Error('Empty reply'+(Scan.dbg.finish?' — finish reason '+Scan.dbg.finish:'')+'.');
    return txt;
  },

  /* ---- clean up whatever the model returned ---- */
  norm(j){
    const num=v=>{const n=parseFloat(String(v??'').replace(',','.'));return isFinite(n)&&n>=0?n:null};
    const blk=o=>{
      if(!o||typeof o!=='object')return null;
      const k=num(o.kcal??o.calories),p=num(o.protein),c=num(o.carbs??o.carbohydrate??o.carbohydrates),f=num(o.fat);
      if(k==null&&p==null&&c==null&&f==null)return null;
      const b={kcal:k||0,protein:p||0,carbs:c||0,fat:f||0};
      if(!b.kcal)b.kcal=round(b.protein*4+b.carbs*4+b.fat*9);
      return b;
    };
    const d={name:String(j.name||'Scanned food').slice(0,60),
      unit:/ml/i.test(String(j.basis||'')+String(j.servingLabel||''))?'ml':'g',
      servingLabel:j.servingLabel||null,servingGrams:num(j.servingGrams),
      per100:blk(j.per100),perServing:blk(j.perServing),
      estimated:!!j.estimated,note:String(j.note||'')};
    if(!d.per100&&d.perServing&&d.servingGrams)d.per100=mul(d.perServing,100/d.servingGrams);
    if(!d.perServing&&d.per100&&d.servingGrams)d.perServing=mul(d.per100,d.servingGrams/100);
    if(!d.per100&&!d.perServing)throw new Error('No usable numbers on that panel.');
    return d;
  },

  /* ---- review sheet ---- */
  reuse(i){const f=S.scans[i];if(!f)return;
    Scan.data=JSON.parse(JSON.stringify(f));Scan.img=null;Scan.review()},

  review(){
    const d=Scan.data,u=d.unit;
    Scan.mode=d.perServing?'serving':'amt';
    Scan.amt=d.perServing?1:100;
    UI.sheet('Check and log',`
      ${Scan.img?`<img class="scan-img" src="${Scan.img}">`:''}
      <div class="field"><label>Food</label><input id="sName" value="${esc(d.name)}"></div>
      <div class="row" style="margin-bottom:13px">
        ${d.perServing?`<span class="chip" id="mSrv" onclick="Scan.setMode('serving')">Servings</span>`:''}
        ${(d.per100||d.servingGrams)?`<span class="chip" id="mAmt" onclick="Scan.setMode('amt')">${u==='ml'?'Millilitres':'Grams'}</span>`:''}
      </div>
      <div class="field"><label id="sAmtL">How much?</label>
        <input id="sAmt" type="number" inputmode="decimal" step="0.1" min="0" oninput="Scan.setAmt(this.value)"></div>
      <div class="scan-out" id="sOut"></div>
      <div class="grid2">
        <div class="field"><label>Meal</label><select id="sM">
          ${MEALS.map(x=>`<option ${x===mealNow()?'selected':''}>${x}</option>`).join('')}</select></div>
        <div class="field"><label>Date</label><input id="sD" type="date" value="${Fuel.day}"></div>
      </div>
      <button class="btn btn-p btn-w" onclick="Scan.commit()">Log it</button>
      <button class="btn btn-g btn-w btn-sm" style="margin-top:9px" onclick="Scan.manual()">Numbers wrong? Edit them</button>
      <div class="notice">${d.estimated?'⚠ No panel was readable, so these are estimates from the food itself. ':''}${
        d.per100?`Label reads ${Math.round(d.per100.kcal)} kcal · P${round(d.per100.protein,1)} C${round(d.per100.carbs,1)} F${round(d.per100.fat,1)} per 100${u}. `:''}${
        d.servingLabel?`Serving: ${esc(d.servingLabel)}. `:''}${esc(d.note)}</div>`);
    Scan.paint();
  },

  setMode(m){Scan.mode=m;Scan.amt=m==='serving'?1:100;Scan.paint()},
  setAmt(v){Scan.amt=v===''?'':(+v||0);Scan.paint(true)},

  paint(skipInput){
    const d=Scan.data,u=d.unit;
    const srv=$('#mSrv'),amt=$('#mAmt');
    if(srv)srv.classList.toggle('on',Scan.mode==='serving');
    if(amt)amt.classList.toggle('on',Scan.mode==='amt');
    const lab=$('#sAmtL');
    if(lab)lab.textContent=Scan.mode==='serving'
      ?`Servings${d.servingLabel?' — '+d.servingLabel:d.servingGrams?` — ${round(d.servingGrams,1)}${u} each`:''}`
      :`How many ${u}?`;
    const inp=$('#sAmt');
    if(inp&&!skipInput)inp.value=Scan.amt;
    const m=Scan.macros(),out=$('#sOut');
    if(!out)return;
    out.innerHTML=m
      ?`<div class="k">${Math.round(m.kcal)}<small>kcal</small></div>
        <div class="m"><span>P <b>${round(m.protein,1)}g</b></span><span>C <b>${round(m.carbs,1)}g</b></span><span>F <b>${round(m.fat,1)}g</b></span></div>`
      :`<div style="color:var(--dim);font-size:13px">Enter an amount to see the macros.</div>`;
  },

  macros(){
    const d=Scan.data,a=+Scan.amt;
    if(!d||!isFinite(a)||a<=0)return null;
    if(Scan.mode==='serving'&&d.perServing)return mul(d.perServing,a);
    if(d.per100)return mul(d.per100,a/100);
    if(d.perServing&&d.servingGrams)return mul(d.perServing,a/d.servingGrams);
    return null;
  },

  label(){const d=Scan.data;
    return Scan.mode==='serving'
      ?(Scan.amt===1?'':` (${round(Scan.amt,2)}×)`)
      :` (${round(Scan.amt,1)}${d.unit})`},

  commit(){
    const m=Scan.macros();
    if(!m){UI.toast('Enter an amount first');return}
    const name=($('#sName').value.trim()||'Scanned food');
    const date=$('#sD').value||todayISO();
    S.meals.unshift({id:uid(),date,name:name+Scan.label(),
      kcal:round(m.kcal),p:round(m.protein,1),c:round(m.carbs,1),f:round(m.fat,1),
      meal:$('#sM').value});
    Scan.remember(name);
    Fuel.day=date;save();UI.closeSheet();UI.go('fuel');UI.toast('Logged '+name);
  },

  remember(name){
    const d=Scan.data;if(!d)return;
    const rec={name,unit:d.unit,servingLabel:d.servingLabel,servingGrams:d.servingGrams,
      per100:d.per100,perServing:d.perServing};
    S.scans=(S.scans||[]).filter(x=>x.name.toLowerCase()!==name.toLowerCase());
    S.scans.unshift(rec);S.scans=S.scans.slice(0,60);
  },

  manual(){
    const m=Scan.macros()||{kcal:0,protein:0,carbs:0,fat:0};
    const name=($('#sName')?.value.trim()||Scan.data?.name||'Scanned food')+Scan.label();
    UI.closeSheet();
    setTimeout(()=>Fuel.add({name,kcal:round(m.kcal),p:round(m.protein,1),
      c:round(m.carbs,1),f:round(m.fat,1)}),200);
  }
};

const mul=(o,k)=>({kcal:o.kcal*k,protein:o.protein*k,carbs:o.carbs*k,fat:o.fat*k});
function grabJSON(t){
  const s=String(t||''),a=s.indexOf('{'),b=s.lastIndexOf('}');
  if(a<0||b<=a)throw new Error('The model replied with something unreadable.');
  try{return JSON.parse(s.slice(a,b+1))}
  catch(e){throw new Error('The model replied with something unreadable.')}
}

Render.fuel=function(){
  const iso=Fuel.day,m=dayMacros(iso),t=S.targets;
  const list=mealsOn(iso);
  const pctK=clamp(m.kcal/(t.kcal||1),0,1.4);
  const week=[...Array(7)].map((_,i)=>{const d=daysAgo(6-i);return{d,k:dayMacros(d).kcal}});

  let h=`<div class="chips" style="margin-top:4px">
    ${[...Array(7)].map((_,i)=>{const d=daysAgo(6-i);
      const lbl=i===6?'Today':new Date(d+'T12:00:00').toLocaleDateString(undefined,{weekday:'short'});
      return `<span class="chip ${d===iso?'on':''}" onclick="Fuel.setDay('${d}')">${lbl}</span>`}).join('')}
    </div>

  <div class="card" style="margin-top:12px">
    <div class="spread" style="margin-bottom:14px">
      <div><div class="disp" style="font-size:34px;line-height:1">${Math.round(m.kcal)}</div>
        <div style="color:var(--dim);font-size:11.5px">of ${t.kcal} kcal</div></div>
      <div style="text-align:right">
        <div class="disp" style="font-size:20px;color:${m.kcal>t.kcal?'var(--bad)':'var(--ok)'}">
          ${m.kcal>t.kcal?'+'+Math.round(m.kcal-t.kcal):Math.round(t.kcal-m.kcal)}</div>
        <div style="color:var(--dim);font-size:11.5px">${m.kcal>t.kcal?'over':'remaining'}</div></div>
    </div>
    <div class="pbar" style="height:10px"><i style="width:${pctK*100/1.4}%;background:${m.kcal>t.kcal?'var(--bad)':'linear-gradient(90deg,var(--acc),var(--acc2))'}"></i></div>
    <div class="divider"></div>
    ${[['Protein',m.p,t.protein],['Carbs',m.c,t.carbs],['Fat',m.f,t.fat]].map(([n,cur,tg])=>
      `<div class="macro-row"><div class="lb"><span>${n}</span><span>${Math.round(cur)} / ${tg}g</span></div>
       <div class="pbar"><i style="width:${clamp(cur/(tg||1)*100,0,100)}%"></i></div></div>`).join('')}
  </div>

  <div class="row" style="margin-bottom:10px">
    <button class="btn btn-p" style="flex:1" onclick="Scan.open()">📷 Scan a label</button>
    <button class="btn btn-ic btn-g" style="height:47px;width:47px" onclick="Scan.pick()" title="Use a photo you already took">🖼</button>
  </div>
  <div class="row" style="margin-bottom:12px">
    <button class="btn btn-g" style="flex:1" onclick="Fuel.add()">+ Log food</button>
    <button class="btn btn-g" style="flex:1" onclick="Fuel.quick()">Quick add</button>
  </div>

  <div class="card"><div class="card-t">Calories · last 7 days</div><div class="chart" style="height:140px"><canvas id="cKcal"></canvas></div></div>

  <div class="sec-t"><h2>${iso===todayISO()?"Today's food":fmtDate(iso)}</h2><span class="lnk">${list.length} items</span></div>
  <div class="card">`;
  if(!list.length){
    h+=`<div class="empty"><div class="e">🍽</div><p>Nothing logged for this day.</p></div>`;
  }else{
    const order=['Breakfast','Lunch','Dinner','Pre-workout','Post-workout','Snack'];

const Coach={
  busy:false,
  push(role,content,silent){
    if(!silent)S.chat.push({role,content,t:Date.now()});
    save();Coach.render();
  },
  render(){
    const log=$('#chatLog');if(!log)return;
    log.innerHTML=S.chat.map(m=>{
      const cls=m.role==='user'?'me':m.role==='system'?'sys':'bot';
      return `<div class="msg ${cls}">${m.role==='system'?esc(m.content):md(m.content)}</div>`}).join('')
      +(Coach.busy?`<div class="msg bot typing"><i></i><i></i><i></i></div>`:'');
    log.scrollTop=log.scrollHeight;
    Coach.quicks();Gem.banner();
  },
  quicks(){
    const q=$('#quicks');if(!q)return;
    let opts=[];
    if(S.onboardStep>=0&&S.onboardStep<ONB.length){
      const step=ONB[S.onboardStep];
      opts=step.type==='choice'?step.ch:(step.opt?['skip']:[]);
    }else{
      opts=['What should I eat today?','Build me a program','How am I progressing?','Make the app green','Log my weight'];
    }
    q.innerHTML=opts.map(o=>`<span class="chip" onclick="Coach.quick('${esc(o).replace(/'/g,"\\'")}')">${esc(o)}</span>`).join('');
  },
  quick(t){$('#chatIn').value=t;Coach.send()},

  begin(){
    S.onboardStep=0;S.chat=[];
    Coach.push('assistant',ONB[0].q);
  },
  async send(){
    const el=$('#chatIn');const text=el.value.trim();if(!text||Coach.busy)return;
    el.value='';el.style.height='auto';
    Coach.push('user',text);
    if(S.onboardStep>=0&&S.onboardStep<ONB.length)return Coach.onboardAnswer(text);
    if(S.settings.provider==='none'||!S.settings.apiKey)return Local.reply(text);
    return Coach.ai(text);
  },
  onboardAnswer(text){
    const step=ONB[S.onboardStep];const raw=text.trim();
    let val=raw;
    if(step.opt&&/^(skip|none|no|n\/a)$/i.test(raw))val=null;
    else if(step.type==='num'){
      const n=parseFloat(raw.replace(',','.').replace(/[^\d.]/g,''));
      if(isNaN(n))return Coach.push('assistant',"I need a number there — just the digits is fine.");
      val=n;
      if(step.k==='heightCm'&&n<3)val=Math.round(n*100);          // entered metres
      if(step.k==='heightCm'&&n>3&&n<8)val=Math.round(n*30.48);   // entered feet
      if(step.k==='weightKg'&&n>200)val=round(n*0.4536,1);        // probably lbs
    }else if(step.type==='choice'){
      const m=step.ch.find(c=>raw.toLowerCase().includes(c.toLowerCase().split(' ')[0]));
      if(!m)return Coach.push('assistant',`Pick one of: ${step.ch.join(', ')}.`);
      val=m;
    }
    S.profile[step.k]=val;
    S.onboardStep++;save();
    if(S.onboardStep<ONB.length){
      const q=ONB[S.onboardStep].q.replace('{name}',S.profile.name||'mate');
      return Coach.push('assistant',q);
    }
    /* finished */
    S.profile.onboarded=true;recalcTargets();
    if(S.profile.weightKg)S.body.push({date:todayISO(),weightKg:S.profile.weightKg});
    S.targets.sleep=8;S.targets.steps=8000;
    const t=S.targets,g=S.profile.goal;
    save();
    Coach.push('assistant',
`Locked in. Here's your baseline:

• **BMR** ${bmr()} kcal — what you'd burn lying in bed all day
• **TDEE** ${tdee()} kcal — what you burn living your life
• **Daily target: ${t.kcal} kcal** ${g==='cut'?'(500 under maintenance — about 0.5 kg/week down)':g==='bulk'?'(350 over — lean gaining, not a dirty bulk)':g==='recomp'?'(slight deficit, high protein — slow but you keep muscle)':'(maintenance)'}
• **Protein ${t.protein}g · Carbs ${t.carbs}g · Fat ${t.fat}g**
• **Water ${t.water}L**

Everything's live on the dashboard now. Three things you can do from this chat:

• **Log stuff** — "ate 200g chicken and rice", "weighed 82.4 today", "benched 100kg for 5"
• **Ask for coaching** — programs, form cues, what to eat, why the scale went up
• **Rebuild the app** — "make it green", "hide the muscle chart", "add a tracker for resting heart rate"

Want me to write you a ${S.profile.daysPerWeek||4}-day program?

One thing worth doing now: connect a free Gemini key. Without it I only understand a fixed set of phrases. With it I can read documents you upload, program properly and rebuild this app on request.

[[connect]]`);
    UI.refresh();
  },

  /* ---------- AI call ---------- */
  sysPrompt(){
    const p=S.profile,t=S.targets;
    const recent=S.workouts.slice(0,5).map(w=>`${w.date} ${w.name}: `+
      w.exercises.map(e=>`${e.name} ${e.sets.map(s=>`${s.w}x${s.r}`).join(',')}`).join('; ')).join('\n')||'none';
    const food=S.meals.slice(0,10).map(m=>`${m.date} ${m.name} ${m.kcal}kcal P${m.p}`).join('\n')||'none';
    const bod=S.body.slice(0,6).map(b=>`${b.date} ${b.weightKg}kg${b.bodyFat?' '+b.bodyFat+'%':''}`).join('\n')||'none';
    const docs=S.docs.map(d=>`--- ${d.name} ---\n${d.text.slice(0,4000)}`).join('\n\n')||'none';
    return `You are the built-in coach inside IRONFORGE, a personal training/nutrition tracking app. You are direct, knowledgeable and warm — a good coach, not a cheerleader. Keep answers tight; use short paragraphs and bullets. Never invent numbers about the user.

USER PROFILE
name: ${p.name||'unknown'} | age: ${p.age} | sex: ${p.sex} | height: ${p.heightCm}cm | weight: ${p.weightKg}kg
goal: ${p.goal} | target weight: ${p.targetWeightKg} | activity: ${p.activity} | experience: ${p.experience}
trains ${p.daysPerWeek} days/week | injuries: ${p.injuries||'none'} | diet: ${p.diet||'none'}
BMR ${bmr()} | TDEE ${tdee()} | BMI ${bmi()}
TARGETS kcal ${t.kcal}, protein ${t.protein}g, carbs ${t.carbs}g, fat ${t.fat}g, water ${t.water}L, sleep ${t.sleep}h

TODAY (${todayISO()}): ${JSON.stringify(dayMacros(todayISO()))}
RECENT WORKOUTS:\n${recent}
RECENT FOOD:\n${food}
RECENT BODY:\n${bod}
PERSONAL RECORDS: ${JSON.stringify(S.prs)}
UPLOADED DOCUMENTS:\n${docs}

=== ACTIONS ===
You can change the app and log data. To do so, end your message with a fenced json block:
\`\`\`json
{"actions":[{"type":"...","...":"..."}]}
\`\`\`
Available action types:
- log_meal {name, kcal, protein, carbs, fat, meal?, date?}
- log_weight {weightKg, bodyFat?, waist?, chest?, arm?, thigh?, date?}
- log_workout {name, date?, exercises:[{name, muscle, sets:[{w,r}]}]}
- log_habit {id, value, date?}   (existing habit ids: ${S.customHabits.map(h=>h.id).join(', ')})
- add_habit {name, unit, target, icon}
- remove_habit {id}
