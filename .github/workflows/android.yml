name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Make sure the SDK has what Capacitor 8 needs
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Install dependencies
        run: npm install

      - name: Generate the native Android project
        run: npx cap add android

      - name: Generate app icons and splash screens
        run: npx capacitor-assets generate --android || echo "Falling back to default icons"

      - name: Copy the web app into the project
        run: npx cap sync android

      - name: Build the APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: ironforge-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
